      { nome: "Investimentos", v: A.g.investimentos, tipo: "neg", cor: "#334155" },
      { nome: "Captação de empréstimos", curto: "Captações", v: A.g.captacoes, tipo: "pos", cor: "var(--blue)" },
      { nome: "Geração de caixa", v: d.caixa, tipo: "tot", cor: "var(--brand)" },
    ].filter(p => p.tipo === "tot" || p.v > 0.005), { rb, altura: 280 })), "");
}

/* ---------- 8. Evolução mensal ---------- */
function telaEvolucao(x) {
  const ms = D.meses.map((m, j) => ({ m, A: agg([j]) }));
  const cats = D.meses.map(m => m.curto);
  const linhasT = LINHAS.filter(l => l.tipo !== "sep" && (!linhaSempreZero(l)));
  const tabela = `<div class="tbl alta"><table class="dre"><tr><th>Linha da DRE</th>${ms.map(o => `<th>${esc(o.m.curto)}</th>`).join("")}${M > 1 ? "<th>Total</th><th>Média</th>" : ""}</tr><tbody>
    ${linhasT.map(l => {
      const vals = ms.map(o => valLinha(l, o.A));
      const cls = l.tipo === "res" ? "l-res" : l.tipo === "sub" || l.tipo === "total" ? "l-sub" : "";
      return `<tr class="${cls}"><td>${l.sinal ? `<span class="sinal">(${l.sinal})</span>` : l.tipo === "sub" || l.tipo === "res" ? "<span class='sinal'>=</span>" : ""}${l.nome}</td>${vals.map((v, j) => {
        const ant = j ? vals[j - 1] : null, ah = ant ? (v - ant) / Math.abs(ant) : null;
        const c = ah == null || Math.abs(ah) < .0005 ? "" : (ah > 0) === !!l.bom ? "down" : "up";
        return `<td data-tt="${tt(esc(l.nome + " · " + ms[j].m.nome), [["Valor", brl(v)], ["% da receita", pct(v / (ms[j].A.d.rb || 1), 2)], ...(ah != null ? [["vs mês anterior", (ah > 0 ? "+" : "") + pct(ah)]] : [])])}">${brl(v)}${ah != null ? `<br><small class="${c}">${ah > 0 ? "▲" : "▼"} ${pct(Math.abs(ah))}</small>` : `<br><small class="mut">${pct(v / (ms[j].A.d.rb || 1), 1)}</small>`}</td>`;
      }).join("")}${M > 1 ? `<td><b>${brl(soma(vals))}</b></td><td class="mut">${brl(soma(vals) / M)}</td>` : ""}</tr>`;
    }).join("")}</tbody></table></div>`;
  const pesoGr = `<div class="rolar"><table class="hm"><tr><th class="r">Grupo</th>${cats.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
    ${GR_DESP.filter(k => TODOS.g[k] > 0).map(k => `<tr><th class="r"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${corG(k)};margin-right:6px"></span>${esc(G[k].nome)}</th>${ms.map(o => { const p = o.A.g[k] / (o.A.d.rb || 1), c = calor(Math.min(1, p / .12)); return `<td style="background:${c.bg};color:${c.fg}">${pct(p, 2)}</td>`; }).join("")}</tr>`).join("")}</table></div>`;
  DESENHOS.push(() => {
    colunas($("#g-ev-col"), cats, [
      { nome: "Receita bruta", cor: "#2a78d6", vals: ms.map(o => o.A.d.rb) },
      { nome: "Lucro líquido gerencial", cor: "#0ca30c", vals: ms.map(o => o.A.d.ll) },
      { nome: "Geração de caixa", cor: "#eb6834", vals: ms.map(o => o.A.d.caixa) },
    ]);
    linhas($("#g-ev-lin"), cats, [
      { nome: "Bruta", cor: "#2a78d6", vals: ms.map(o => o.A.d.lb / (o.A.d.rb || 1)) },
      { nome: "Contribuição", cor: "#eb6834", vals: ms.map(o => o.A.d.mc / (o.A.d.rb || 1)) },
      { nome: "EBITDA", cor: "#1baf7a", vals: ms.map(o => o.A.d.ebitda / (o.A.d.rb || 1)) },
      { nome: "Líquida", cor: "#4a3aa7", vals: ms.map(o => o.A.d.ll / (o.A.d.rb || 1)) },
    ]);
  });
  return `<div class="sec-h"><div><h2>Evolução Mensal</h2><p>Mês a mês, todos os meses da planilha · cada aba do Excel vira uma coluna</p></div><div class="badges"><span class="badge blue">${M} ${M > 1 ? "meses" : "mês"} na planilha</span></div></div>
    ${M < 2 ? `<div class="aviso"><b>Ainda só há ${esc(D.meses[0].nome)} na planilha.</b> Quando você adicionar a aba do próximo mês (ex.: "DRE JULHO 26") e rodar o <b>atualizar.bat</b>, esta tela passa a mostrar a tendência, a variação mês a mês e o acumulado do ano.</div>` : ""}
    <div class="row c2e">
      ${card("Receita, lucro e caixa por mês", "Valores em R$", `<div class="legend"><span><i style="--c:#2a78d6"></i>Receita bruta</span><span><i style="--c:#0ca30c"></i>Lucro líquido gerencial</span><span><i style="--c:#eb6834"></i>Geração de caixa</span></div><div class="chart" id="g-ev-col"></div>`)}
      ${card("Margens por mês", "% sobre a receita bruta", `<div class="legend"><span><i class="ln" style="--c:#2a78d6"></i>Margem bruta</span><span><i class="ln" style="--c:#eb6834"></i>Contribuição</span><span><i class="ln" style="--c:#1baf7a"></i>EBITDA</span><span><i class="ln" style="--c:#4a3aa7"></i>Líquida</span></div><div class="chart" id="g-ev-lin"></div>`)}
    </div>
    ${card("DRE mês a mês", "Valores e variação contra o mês anterior (verde = melhorou, vermelho = piorou)", tabela)}
    ${card("Peso de cada grupo na receita", "% da receita bruta em cada mês · quanto mais escuro, maior o peso", pesoGr)}`;
}

/* ---------- 9. Diagnóstico ---------- */
function telaDiagnostico(x) {
  const { A, P } = x, rb = x.d.rb || 1;
  const al = alertas(x);
  const vals = IND.map(i => statusInd(i, i.f(x.d, A))).filter(Boolean);
  const cont = { ok: vals.filter(v => v === "ok").length, aten: vals.filter(v => v === "aten").length, crit: vals.filter(v => v === "crit").length };
  const MOTIVO = {
    frota: "Custo do veículo (IPVA, multa, seguro, manutenção), não imposto sobre a venda nem investimento",
    comerciais: "Viagem comercial é despesa de venda, não custo da mercadoria",
    amort_divida: "Pagamento do principal de empréstimo: sai do caixa, mas não é despesa",
    emprestimos_concedidos: "Dinheiro emprestado a terceiros: é um valor a receber, não despesa",
    nao_ident: "PIX sem identificação não é tributo. Fica separado até ser identificado",
    admin: "Seguro e manutenção de máquinas são despesas da operação, não investimentos",
    captacoes: "Empréstimo recebido é entrada de caixa, não receita",
    deducoes: "Devolução e desconto reduzem a receita",
  };
  const reclass = C.map((c, i) => ({ c, i })).filter(({ c }) => D.secao_grupo[c.sec] !== c.g);
  const conf = D.conferencias.filter(c => P.ids.map(j => D.meses[j].k).includes(c.mes));
  const rotErrado = conf.filter(c => /despesas com entrega/i.test(c.rotulo) && c.secao !== "entregas");
  const codRep = Object.entries(C.reduce((m, c) => ((m[c.cod] = m[c.cod] || new Set()).add(D.secoes[c.sec]), m), {})).filter(([, s]) => s.size > 1);
  const zeradas = C.filter((c, i) => Math.abs(TODOS.c[i]) < 0.005).length;
  const res = P.ids.map(j => ({ m: D.meses[j], d: agg([j]).d }));

  return `${cabecalho("Diagnóstico do Especialista", "Leitura da DRE, alertas, recomendações e todas as correções feitas na planilha", x)}
    ${card("Saúde financeira do período", `${vals.length} indicadores comparados com referências de mercado para distribuidoras`, `<div class="score"><div class="ok"><b>${cont.ok}</b>saudáveis</div><div class="aten"><b>${cont.aten}</b>em atenção</div><div class="crit"><b>${cont.crit}</b>críticos</div></div>
      <div class="inds" style="margin-top:12px">${IND.map(i => linhaInd(i, x)).join("")}</div>`)}
    ${card("Alertas e recomendações", "Gerados automaticamente a partir dos números do período", `<div class="ins">${al.map(cardAlerta).join("")}</div>`)}
    ${card("Ajustes feitos na DRE", `${reclass.length} conta(s) mudaram de grupo. Os valores da planilha não foram alterados.`, `<div class="tbl" style="max-height:440px"><table><tr><th>Código</th><th style="text-align:left">Conta</th><th style="text-align:left">Estava em</th><th style="text-align:left">Foi para</th><th>Valor ${esc(P.curto)}</th><th style="text-align:left">Motivo</th></tr><tbody>
      ${reclass.sort((a, b2) => A.c[b2.i] - A.c[a.i]).map(({ c, i }) => `<tr class="${Math.abs(A.c[i]) < 0.005 ? "zero" : ""}"><td class="cod">${c.cod}</td><td class="txt">${esc(c.nome)}</td><td class="txt mut">${esc(D.secoes[c.sec])}</td><td class="txt"><b>${esc(G[c.g].nome)}</b></td><td>${brl(A.c[i])}</td><td class="txt mut" style="min-width:260px">${esc(MOTIVO[c.g] || "Classificação gerencial")}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="nota"><b>Também ajustado:</b> "Pagamento de Fornecedores" é tratado como CPV (a linha CMV está vazia na planilha). Os grupos Manutenção e Entregas, que tinham o rótulo de total "Despesas com Entrega", aparecem com os nomes certos. As grafias dos nomes foram corrigidas só na tela, por exemplo Manuteção → Manutenção e Hopedagem → Hospedagem.</p>`)}
    <div class="row c2e">
      ${card("Conferência da planilha", "Os totais da planilha batem com a soma das contas?", `<div class="tbl" style="max-height:440px"><table><tr><th>Mês</th><th style="text-align:left">Total da planilha</th><th>Planilha</th><th>Soma das contas</th><th></th></tr><tbody>
        ${conf.map(c => `<tr><td class="mut">${esc(D.meses.find(m => m.k === c.mes).curto)}</td><td class="txt">${esc(D.secoes[c.secao] || c.secao)}</td><td>${brl(c.planilha)}</td><td>${brl(c.calculado)}</td><td>${c.ok ? '<span class="ok-mark">✓</span>' : '<span class="x-mark">✗</span>'}</td></tr>`).join("")}
        ${res.map(r => `<tr style="font-weight:700"><td class="mut">${esc(r.m.curto)}</td><td class="txt">Resultado final (lucro/prejuízo acumulado)</td><td>${r.m.resultado != null ? brl(r.m.resultado) : "—"}</td><td>${brl(r.d.caixa)}</td><td>${r.m.resultado != null && Math.abs(r.m.resultado - r.d.caixa) < .05 ? '<span class="ok-mark">✓</span>' : '<span class="x-mark">✗</span>'}</td></tr>`).join("")}
        </tbody></table></div>`)}
      ${card("Qualidade do plano de contas", "Pontos para a contabilidade melhorar na planilha", `<div class="ins" style="grid-template-columns:1fr">
        ${rotErrado.length ? cardAlerta({ nivel: "aten", titulo: `${rotErrado.length} total(is) com o nome errado`, texto: `Os totais de ${rotErrado.map(c => esc(D.secoes[c.secao])).join(", ")} se chamam "Total Despesas com Entrega".`, acao: "Renomear cada total com o nome do seu grupo." }) : ""}
        ${codRep.length ? cardAlerta({ nivel: "aten", titulo: `${codRep.length} código(s) de conta repetido(s)`, texto: `Por exemplo, ${codRep[0][0]} aparece em ${[...codRep[0][1]].join(", ")}. Isso confunde relatórios e integrações.`, acao: "Dar um código único para cada conta, por exemplo 4.2.1.05.xxxxx para Entregas e 4.2.1.06.xxxxx para Financeiras." }) : ""}
        ${cardAlerta({ nivel: "info", titulo: `${zeradas} de ${NC} contas sem movimento`, texto: "Contas sem valor em nenhum mês. Ficam escondidas no dashboard, mas ocupam espaço na planilha.", acao: "Manter só as que são usadas de verdade e juntar as parecidas, como as hospedagens por região." })}
        ${cardAlerta({ nivel: "info", titulo: "DRE pelo regime de caixa", texto: "Os valores são o que entrou e saiu do caixa no mês. Por isso há pagamentos de dívida e de investimentos misturados nas despesas, o que esta análise separou.", acao: "Manter as contas de dívida e de investimento num bloco separado, abaixo do lucro, como nesta DRE gerencial." })}
      </div>`)}
    </div>
    ${card("Como ler esta DRE", "Glossário rápido", `<div class="glos">
      <div><b>Receita bruta</b>Tudo o que entrou de vendas no período, em todas as formas de recebimento.</div>
      <div><b>Receita líquida</b>Receita bruta menos os impostos sobre a venda (ICMS, Simples e outros).</div>
      <div><b>Lucro bruto</b>Receita líquida menos o que foi pago aos fornecedores pelas mercadorias e pelos fretes de compra.</div>
      <div><b>Margem de contribuição</b>O que sobra depois dos custos que sobem e descem com a venda, como comissões e entregas. É isso que paga as despesas fixas.</div>
      <div><b>EBITDA</b>Resultado da operação antes de juros e de investimentos. Mostra se o negócio, sozinho, gera dinheiro.</div>
      <div><b>Lucro líquido gerencial</b>EBITDA menos as despesas financeiras (juros e tarifas). É o lucro do negócio no período.</div>
      <div><b>Geração de caixa</b>Lucro menos as parcelas de dívida e os investimentos. Bate com o resultado final da planilha.</div>
      <div><b>Ponto de equilíbrio</b>A venda mínima para cobrir todas as despesas fixas e financeiras, sem lucro e sem prejuízo.</div>
    </div>`)}`;
}

/* ======================= render ======================= */
const TELAS = { visao: telaVisao, dre: telaDre, arvore: telaArvore, despesas: telaDespesas, logistica: telaLogistica, receitas: telaReceitas, financeiro: telaFinanceiro, evolucao: telaEvolucao, diagnostico: telaDiagnostico };
function render(manterScroll) {
  const y = scrollY;
  DESENHOS.length = 0;
  tip.hidden = true;
  const x = ctx();
  $("#app").innerHTML = TELAS[S.tab](x);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  desenhar();
  if (S.tab === "arvore") requestAnimationFrame(ligarArvore);
  contar();
  if (manterScroll) scrollTo(0, y);
  salvar();
}

if (TELAS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
addEventListener("error", e => { const p = document.createElement("pre"); p.style.cssText = "background:#fbeaea;color:#b42323;padding:12px;margin:12px;border-radius:10px;white-space:pre-wrap"; p.textContent = "Erro no dashboard: " + e.message + " (linha " + e.lineno + ")"; document.body.prepend(p); });
$("#tabs").innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${n}</button>`).join("");
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  S.tab = t.dataset.tab; render(); scrollTo({ top: 0 });
  t.scrollIntoView({ block: "nearest", inline: "nearest" });
});
$("#per").innerHTML = PER.map((p, i) => `<option value="${i}">${esc(p.nome)}</option>`).join("");
$("#per").value = S.per;
$("#per").addEventListener("change", e => { S.per = +e.target.value; render(true); });
$("#imprimir").addEventListener("click", () => print());

$("#app").addEventListener("click", e => {
  const el = e.target.closest("[data-abre],[data-acao],[data-no],[data-raiz],[data-medida],[data-pareto]");
  if (!el) return;
  if (el.dataset.abre) {
    const k = el.dataset.abre;
    S.dreAberto.has(k) ? S.dreAberto.delete(k) : S.dreAberto.add(k);
    return render(true);
  }
  const ac = el.dataset.acao;
  if (ac === "abrir") { LINHAS.filter(l => l.g).forEach(l => { S.dreAberto.add("L:" + l.k); l.g.forEach(g => subsDe(TODOS, g).forEach(s => S.dreAberto.add("S:" + g + "|" + s.nome))); }); return render(true); }
  if (ac === "fechar") { S.dreAberto.clear(); return render(true); }
  if (ac === "zero") { S.dreZero = !S.dreZero; return render(true); }
  if (ac === "csv") return exportarCsv();
  if (ac === "limpar") { S.arvCaminho = []; return render(true); }
  if (ac === "maior") { seguirMaior(ctx().A); return render(true); }
  if (el.dataset.raiz) { S.arvRaiz = el.dataset.raiz; S.arvCaminho = []; return render(true); }
  if (el.dataset.medida) { S.arvMedida = el.dataset.medida; return render(true); }
  if (el.dataset.pareto != null) { S.paretoCpv = el.dataset.pareto === "1"; return render(true); }
  if (el.dataset.no != null) {
    const l = +el.dataset.no;
    if (l < 0) { S.arvCaminho = []; return render(true); }
    const k = el.dataset.k;
    if (S.arvCaminho[l] === k) S.arvCaminho = S.arvCaminho.slice(0, l);
    else S.arvCaminho = [...S.arvCaminho.slice(0, l), k];
    if (l === 2) S.arvCaminho = S.arvCaminho.slice(0, 3);
    return render(true);
  }
});
$("#app").addEventListener("input", e => {
  if (e.target.id !== "busca") return;
  S.dreBusca = e.target.value;
  const pos = e.target.selectionStart;
  render(true);
  const inp = $("#busca"); inp.focus(); inp.setSelectionRange(pos, pos);
});

$("#logo-cliente").innerHTML = LOGO_CLIENTE ? `<img src="${LOGO_CLIENTE}" alt="Distribuidora Modelo Distribuidora">` : `<div class="logo-txt"><b>CLIENTE</b><small>Distribuidora</small></div>`;
$("#logo-parceiro").innerHTML = LOGO_PARCEIRO ? `<img src="${LOGO_PARCEIRO}" alt="Parceiro Inteligência em Gestão">` : `<div class="logo-txt" style="text-align:right"><small>Projeto de portfólio</small><b style="font-size:15px">Dados fictícios</b></div>`;
$("#fonte").textContent = `Fonte: ${D.arquivo} · ${M} ${M > 1 ? "meses" : "mês"} (${D.meses.map(m => m.aba).join(", ")})`;
$("#gerado").textContent = `Atualizado em ${D.gerado} · Lucas Rodrigues · Analista de Dados & BI`;
render();
</script>
</body>

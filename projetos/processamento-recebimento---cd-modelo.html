const M = D.metas, NN = D.noites.length, NB = D.bipadores.length, HORAS = [0, 1, 2, 3, 4, 5];
const $ = s => document.querySelector(s);

/* ---------------- formatos ---------------- */
const fmt = v => Math.round(v).toLocaleString("pt-BR");
const fmt1 = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (v, d = 1) => v == null || !isFinite(v) ? "—" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const soma = a => a.reduce((x, y) => x + y, 0);
const media = a => a.length ? soma(a) / a.length : null;
function dur(m) { if (m == null || !isFinite(m)) return "—"; const s = m < 0 ? "−" : ""; m = Math.abs(Math.round(m)); return m < 60 ? `${s}${m} min` : `${s}${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`; }
function relogio(m) { m = Math.round(m); const d = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(d / 60)).padStart(2, "0")}:${String(d % 60).padStart(2, "0")}`; }
const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const dt = i => new Date(D.noites[i] + "T00:00:00");
const ddmm = i => D.noites[i].slice(8, 10) + "/" + D.noites[i].slice(5, 7);
const nomeNoite = i => `${DOW[dt(i).getDay()]} ${ddmm(i)}`;
const curto = n => n.split(" ")[0] + " " + (n.split(" ").slice(-1)[0] || "")[0] + ".";

/* ---------------- períodos ---------------- */
const PER = [{ nome: `Todas as noites (${ddmm(0)} a ${ddmm(NN - 1)})`, ids: D.noites.map((_, i) => i), prev: null, tipo: "tudo" }];
const semanas = new Map();
D.noites.forEach((_, i) => { const d = dt(i), seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const k = seg.toISOString().slice(0, 10); if (!semanas.has(k)) semanas.set(k, []); semanas.get(k).push(i); });
const listaSem = [...semanas.values()];
listaSem.forEach((ids, k) => PER.push({ nome: `Semana ${k + 1} (${ddmm(ids[0])} a ${ddmm(ids[ids.length - 1])})`, ids, prev: k ? listaSem[k - 1] : null, prevNome: k ? `semana ${k}` : "", tipo: "semana" }));
D.noites.forEach((_, i) => PER.push({ nome: `Noite de ${nomeNoite(i)}`, ids: [i], prev: i ? [i - 1] : null, prevNome: i ? `a noite de ${nomeNoite(i - 1)}` : "", tipo: "noite" }));

/* ---------------- cálculos ---------------- */
const ativa = r => r[3] >= M.hora_ativa;
// perfil de cada bipador usando todo o histórico (fica estável entre os filtros)
const PERFIL = (() => {
  const q = new Array(NB).fill(0), h = new Array(NB).fill(0);
  D.bip.forEach(r => { if (ativa(r)) { q[r[1]] += r[3]; h[r[1]]++; } });
  return D.bipadores.map((_, b) => h[b] === 0 ? "e" : (q[b] / h[b] >= 300 && h[b] >= 3 ? "d" : "a"));
})();
const PERFIL_NOME = { d: "Bipagem dedicada", a: "Apoio", e: "Eventual" };

function agg(ids) {
  const set = new Set(ids), linhas = D.bip.filter(r => set.has(r[0]));
  const b = D.bipadores.map((nome, k) => ({ k, nome, perfil: PERFIL[k], total: 0, qa: 0, ha: 0, noites: new Set(), porHora: HORAS.map(() => ({ q: 0, h: 0 })) }));
  const hora = HORAS.map(h => ({ h, total: 0, qa: 0, ha: 0 }));
  const noite = ids.map(i => ({ i, total: 0, qa: 0, ha: 0, bip: new Set() }));
  const idxN = Object.fromEntries(ids.map((i, k) => [i, k]));
  linhas.forEach(r => {
    const [n, k, h, q] = r, at = ativa(r);
    b[k].total += q; b[k].noites.add(n); hora[h].total += q; noite[idxN[n]].total += q;
    if (at) { b[k].qa += q; b[k].ha++; b[k].porHora[h].q += q; b[k].porHora[h].h++; hora[h].qa += q; hora[h].ha++; noite[idxN[n]].qa += q; noite[idxN[n]].ha++; noite[idxN[n]].bip.add(k); }
  });
  b.forEach(x => (x.uph = x.ha ? x.qa / x.ha : null));
  hora.forEach(x => { x.media = x.total / ids.length; x.bip = x.ha / ids.length; x.uph = x.ha ? x.qa / x.ha : null; });
  noite.forEach(x => (x.uph = x.ha ? x.qa / x.ha : null));
  const total = soma(linhas.map(r => r[3])), qa = soma(b.map(x => x.qa)), ha = soma(b.map(x => x.ha));
  const lh = D.lh.filter(l => set.has(l.n)).map(l => {
    const atraso = l.cheg - l.prev, disp = Math.max(l.cheg, M.inicio_turno);
    return { ...l, atraso, disp, patio: disp - l.cheg, espera: l.lacre - disp, descarga: l.fim - l.lacre, situ: atraso < -M.tolerancia ? "ant" : atraso <= M.tolerancia ? "ok" : "atr" };
  });
  return { ids, b, hora, noite, total, qa, ha, uph: ha ? qa / ha : null, ativos: media(noite.map(x => x.bip.size)), lh };
}
const CACHE = {};
const A = ids => CACHE[ids.join()] || (CACHE[ids.join()] = agg(ids));
const TODOS = A(D.noites.map((_, i) => i));

/* ---------------- tooltip ---------------- */
const tip = $("#tip");

document.addEventListener("mousemove", e => { if (!tip.hidden) mover(e); });
function mover(e) { const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`; }

/* ---------------- peças ---------------- */
function delta(cur, prev, bomSubir, base) {
  if (prev == null || cur == null || !prev) return "";
  const v = (cur - prev) / Math.abs(prev);
  if (Math.abs(v) < .0005) return `<span class="delta eq">=</span>`;
  return `<span class="delta ${(v > 0) === bomSubir ? "bom" : "ruim"}" title="vs ${esc(base)}">${v > 0 ? "▲" : "▼"} ${pct(Math.abs(v))}</span>`;
}
const kpi = (nome, valor, sub, cor, extra = "") => `<div class="kpi" style="--c:${cor}"><div class="kpi-l">${nome}</div><div class="kpi-v">${valor}</div><div class="kpi-s">${sub}</div><div class="kpi-f">${extra}</div></div>`;

const farol = (v, meta, maior = true) => v == null ? "" : (maior ? v >= meta : v <= meta) ? `<span class="st ok">● na meta</span>` : (maior ? v >= meta * .8 : v <= meta * 1.5) ? `<span class="st aten">● perto</span>` : `<span class="st crit">● fora</span>`;
const ins = (nivel, ic, t, p) => `<div class="in ${nivel}"><span class="ic">${ic}</span><b>${t}</b><p>${p}</p></div>`;

const DESENHOS = [];

/* ---------------- gráficos ---------------- */
function eixo(maxV, n = 4) { const bruto = maxV / n, mag = Math.pow(10, Math.floor(Math.log10(bruto || 1))); const p = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= bruto); const out = []; for (let v = 0; v <= maxV + p * .5; v += p) out.push(v); return out; }

// Curva da noite: volume médio por hora (em cima) e bipadores ativos (embaixo), mesmo eixo X
function curva(el, hora) {
  const W = el.clientWidth || 700, H1 = 230, H2 = 82, pl = 50, pr = 10, pt = 22, gap = 34, H = pt + H1 + gap + H2 + 26;
  const mx = Math.max(...hora.map(h => h.media), 1), tk = eixo(mx), top = tk[tk.length - 1];
  const mb = Math.max(...hora.map(h => h.bip), 1);
  const bw = (W - pl - pr) / 6, w = Math.min(64, bw * .62);
  const y = v => pt + H1 - v / top * H1, y2 = v => pt + H1 + gap + H2 - v / mb * (H2 - 14);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tk.forEach(v => (s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`));
  s += `<text class="ax" x="${pl - 8}" y="${pt + H1 + gap + 6}" text-anchor="end" style="font-weight:700">bip.</text><line x1="${pl}" x2="${W - pr}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--axis)"/>`;
  const pico = hora.reduce((a, b) => (b.media > a.media ? b : a));
  hora.forEach((h, k) => {
    const cx = pl + k * bw + bw / 2, linhas = [["Pacotes (média/noite)", fmt(h.media), "var(--vol)"], ["Bipadores ativos (média)", fmt1(h.bip), "var(--equipe)"], ["UPH na hora", h.uph ? fmt(h.uph) : "—"]];
    s += `<g data-tt="${tt(`${String(h.h).padStart(2, "0")}h às ${String(h.h + 1).padStart(2, "0")}h`, linhas)}"><rect x="${cx - bw / 2}" y="${pt - 10}" width="${bw}" height="${H - pt}" fill="transparent"/>
      <rect x="${cx - w / 2}" y="${y(h.media)}" width="${w}" height="${Math.max(1.5, y(0) - y(h.media))}" rx="4" fill="var(--vol)" opacity="${h === pico ? 1 : .78}"/>
      <text class="lbl" x="${cx}" y="${y(h.media) - 6}" text-anchor="middle">${fmt(h.media)}</text>
      <rect x="${cx - w / 2}" y="${y2(h.bip)}" width="${w}" height="${Math.max(1.5, y2(0) - y2(h.bip))}" rx="3" fill="var(--equipe)"/>
      <text class="lbl" x="${cx}" y="${y2(h.bip) - 5}" text-anchor="middle">${fmt1(h.bip)}</text>
      <text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle" style="font-weight:700;fill:var(--ink-2)">${String(h.h).padStart(2, "0")}h</text></g>`;
  });
  el.innerHTML = s + "</svg>";
}

// Colunas por noite (todas as noites, destacando as do período)
function colNoites(el, valores, ids, { cor = "var(--vol)", fmtV = fmt, meta = null, nomeMeta = "", altura = 230 } = {}) {
  const W = el.clientWidth || 700, H = altura, pl = 50, pr = 10, pt = 22, pb = 34;
  const mx = Math.max(...valores.filter(v => v != null), meta || 0, 1), tk = eixo(mx), top = tk[tk.length - 1];
  const bw = (W - pl - pr) / NN, w = Math.max(4, Math.min(34, bw * .66)), sel = new Set(ids);
  const y = v => pt + (H - pt - pb) - v / top * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tk.forEach(v => (s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtV(v)}</text>`));
  valores.forEach((v, i) => {
    const cx = pl + i * bw + bw / 2, on = sel.has(i);
    s += `<g data-tt="${tt(nomeNoite(i), [["Valor", v == null ? "—" : fmtV(v), cor]])}"><rect x="${cx - bw / 2}" y="${pt}" width="${bw}" height="${H - pt}" fill="transparent"/>`;
    if (v != null) s += `<rect x="${cx - w / 2}" y="${y(v)}" width="${w}" height="${Math.max(1.5, y(0) - y(v))}" rx="3" fill="${cor}" opacity="${on ? 1 : .25}"/>`;
    if (on && v != null && (ids.length <= 8 || bw > 38)) s += `<text class="lbl" x="${cx}" y="${y(v) - 5}" text-anchor="middle" style="font-size:10px">${fmtV(v)}</text>`;
    if (bw > 26 || i % 2 === 0) s += `<text class="ax" x="${cx}" y="${H - 18}" text-anchor="middle" style="font-size:10px">${ddmm(i)}</text><text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle" style="font-size:9.5px">${DOW[dt(i).getDay()]}</text>`;
    s += `</g>`;
  });
  if (meta != null) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text class="lbl" x="${W - pr}" y="${y(meta) - 5}" text-anchor="end" style="fill:var(--bad-ink)">${nomeMeta}</text>`;
  el.innerHTML = s + "</svg>";
}

// Dispersão: horas ativas × UPH
function dispersao(el, b) {
  const pts = b.filter(x => x.ha > 0), W = el.clientWidth || 600, H = 300, pl = 50, pr = 16, pt = 16, pb = 36;
  const mxX = Math.max(...pts.map(p => p.ha), 1), mxY = Math.max(...pts.map(p => p.uph), M.uph) * 1.08;
  const tkY = eixo(mxY), topY = tkY[tkY.length - 1], tkX = eixo(mxX, 5), topX = tkX[tkX.length - 1];
  const x = v => pl + v / topX * (W - pl - pr), y = v => pt + (H - pt - pb) - v / topY * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tkY.forEach(v => (s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`));
  tkX.forEach(v => (s += `<text class="ax" x="${x(v)}" y="${H - 18}" text-anchor="middle">${fmt(v)}</text>`));
  s += `<text class="ax" x="${(pl + W - pr) / 2}" y="${H - 2}" text-anchor="middle" style="font-weight:700">horas ativas no período</text>`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(M.uph)}" y2="${y(M.uph)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text class="lbl" x="${pl + 6}" y="${y(M.uph) - 6}" style="fill:var(--bad-ink)">meta ${fmt(M.uph)} UPH</text>`;
  pts.sort((a, c) => a.uph - c.uph).forEach(p => {
    const cor = p.perfil === "d" ? "var(--vol)" : "var(--espera)";
    s += `<g data-tt="${tt(esc(p.nome), [["UPH", fmt(p.uph), cor], ["Horas ativas", fmt(p.ha)], ["Pacotes", fmt(p.total)], ["Perfil", PERFIL_NOME[p.perfil]]])}">
      <circle cx="${x(p.ha)}" cy="${y(p.uph)}" r="13" fill="transparent"/><circle cx="${x(p.ha)}" cy="${y(p.uph)}" r="6.5" fill="${cor}" stroke="#fff" stroke-width="2"/>
      <text class="lbl2" x="${x(p.ha) + (x(p.ha) > W - 90 ? -10 : 10)}" y="${y(p.uph) + 4}" text-anchor="${x(p.ha) > W - 90 ? "end" : "start"}" style="font-size:10.5px">${esc(curto(p.nome))}</text></g>`;
  });
  el.innerHTML = s + "</svg>";
}

// Linha do tempo das carretas de uma noite
function gantt(el, lhs) {
  if (!lhs.length) { el.innerHTML = `<div class="nota">Nenhuma carreta nesta noite.</div>`; return; }
  const W = el.clientWidth || 900, rh = 34, pt = 30, pl = 150, pr = 14, H = pt + lhs.length * rh + 8;
  const ini = Math.min(-60, ...lhs.map(l => Math.min(l.prev, l.cheg))), fim = Math.max(M.fim_turno, ...lhs.map(l => l.fim));
  const a = Math.floor(ini / 60) * 60, b = Math.ceil(fim / 60) * 60, x = m => pl + (m - a) / (b - a) * (W - pl - pr);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  s += `<rect x="${x(M.inicio_turno)}" y="${pt - 8}" width="${x(M.fim_turno) - x(M.inicio_turno)}" height="${H - pt}" fill="#eef6fb"/><text class="ax" x="${x(M.fim_turno) - 6}" y="${H - 4}" text-anchor="end" style="font-weight:700;fill:var(--brand-ink)">turno de trabalho</text>`;
  for (let m = a; m <= b; m += 60) s += `<line x1="${x(m)}" x2="${x(m)}" y1="${pt - 8}" y2="${H}" stroke="var(--grid)"/><text class="ax" x="${x(m)}" y="${pt - 14}" text-anchor="middle">${relogio(m).slice(0, 2)}h</text>`;
  lhs.forEach((l, k) => {
    const yy = pt + k * rh + rh / 2, corA = l.situ === "atr" ? "var(--bad)" : "var(--good)";
    const linhas = [["Previsto", relogio(l.prev)], ["Chegada", `${relogio(l.cheg)} (${l.atraso > 0 ? "+" : ""}${dur(l.atraso)})`, corA], ["Aguardando o turno", dur(l.patio), "var(--patio)"], ["Espera p/ abrir lacre", dur(l.espera), "var(--espera)"], ["Descarga", dur(l.descarga), "var(--desc)"], ["Pacotes em piso", fmt(l.piso)], ["Motivo", l.motivo || "—"]];
    s += `<g data-tt="${tt(esc(l.lh), linhas)}"><rect x="0" y="${yy - rh / 2}" width="${W}" height="${rh}" fill="transparent"/>
      <text class="lbl2" x="0" y="${yy - 2}" style="font-weight:700;fill:var(--ink)">${esc(l.lh)}</text><text class="ax" x="0" y="${yy + 11}">${fmt(l.piso)} pacotes</text>
      <line x1="${x(l.prev)}" x2="${x(l.cheg)}" y1="${yy}" y2="${yy}" stroke="${corA}" stroke-width="2" stroke-dasharray="${l.situ === "atr" ? "0" : "3 3"}"/>
      ${l.patio > 0 ? `<rect x="${x(l.cheg)}" y="${yy - 5}" width="${x(l.disp) - x(l.cheg)}" height="10" rx="2" fill="var(--patio)" opacity=".55"/>` : ""}
      <rect x="${x(l.disp)}" y="${yy - 8}" width="${Math.max(2, x(l.lacre) - x(l.disp))}" height="16" rx="3" fill="var(--espera)"/>
      <rect x="${x(l.lacre)}" y="${yy - 8}" width="${Math.max(2, x(l.fim) - x(l.lacre))}" height="16" rx="3" fill="var(--desc)"/>
      <rect x="${x(l.prev) - 5}" y="${yy - 5}" width="10" height="10" transform="rotate(45 ${x(l.prev)} ${yy})" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${x(l.cheg)}" cy="${yy}" r="4.5" fill="${corA}" stroke="#fff" stroke-width="1.5"/></g>`;
  });
  el.innerHTML = s + "</svg>";
}

/* ---------------- estado ---------------- */
const S = { tab: "turno", per: 0, ordem: "uph", noiteLH: null };
const ctx = () => { const P = PER[S.per]; return { P, X: A(P.ids), B: P.prev ? A(P.prev) : null }; };

/* ---------------- telas ---------------- */
function cab(t, s, P, extra = "") { return `<div class="sec-h"><div><h2>${t}</h2><p>${s}</p></div><div class="badges"><span class="badge">${esc(P.nome)}</span>${P.prev ? `<span class="badge cinza">comparando com ${esc(P.prevNome)}</span>` : ""}${extra}</div></div>`; }

function insights(X) {
  const out = [], h = X.hora, pico = h.reduce((a, b) => (b.media > a.media ? b : a));
  const depois = h.slice(h.indexOf(pico) + 1).filter(x => x.bip >= 1), quedaBase = depois.length ? depois[depois.length - 1] : pico;
  out.push(ins("info", "⏱", `Pico às ${String(pico.h).padStart(2, "0")}h: ${fmt(pico.media)} pacotes por noite`, `Com ${fmt1(pico.bip)} bipadores ativos em média. ${quedaBase !== pico ? `Às ${String(quedaBase.h).padStart(2, "0")}h o volume já é ${pct(1 - quedaBase.media / pico.media, 0)} menor. É a janela para os intervalos sem perder ritmo.` : ""}`));
  const b = X.b.filter(x => x.ha > 0), porTotal = [...b].sort((p, q) => q.total - p.total), porUph = [...b].sort((p, q) => q.uph - p.uph);
  if (porTotal[0] && porUph[0] && porTotal[0].k !== porUph[0].k) out.push(ins("info", "⚖", `Quem mais bipou não é o mais rápido`, `${esc(porTotal[0].nome)} lidera em volume (${fmt(porTotal[0].total)} pacotes), mas ${esc(porUph[0].nome)} tem o maior ritmo: ${fmt(porUph[0].uph)} por hora. Por isso o ranking justo é por UPH.`));
  const st = X.uph >= M.uph ? "ok" : X.uph >= M.uph * .8 ? "aten" : "crit";
  out.push(ins(st, st === "ok" ? "✓" : "!", `UPH da equipe: ${fmt(X.uph)} pacotes/hora`, `Meta de ${fmt(M.uph)}. ${b.filter(x => x.uph >= M.uph).length} de ${b.length} bipadores atingem a meta nas horas ativas.`));
  const top3 = soma(porTotal.slice(0, 3).map(x => x.total)) / (X.total || 1);
  out.push(ins(top3 > .6 ? "aten" : "info", "◔", `3 pessoas fazem ${pct(top3, 0)} da bipagem`, top3 > .6 ? "Dependência alta: uma falta dessas pessoas derruba o turno. Vale treinar o apoio para a bipagem." : "A carga está bem distribuída na equipe."));
  const atr = X.lh.filter(l => l.situ === "atr"), mot = {};
  atr.forEach(l => (mot[l.motivo || "Não informado"] = (mot[l.motivo || "Não informado"] || 0) + 1));
  const mTop = Object.entries(mot).sort((p, q) => q[1] - p[1])[0];
  if (mTop) out.push(ins("crit", "!", `${pct(mTop[1] / atr.length, 0)} dos atrasos: ${esc(mTop[0])}`, `${atr.length} de ${X.lh.length} carretas chegaram com mais de ${M.tolerancia} min de atraso. A causa principal é de gestão (escala de parada) e pode ser resolvida com a transportadora.`));
  const antes = X.lh.filter(l => l.patio > 0);
  if (antes.length) out.push(ins("aten", "⌛", `${antes.length} carretas chegaram antes do turno`, `Ficaram em média ${dur(media(antes.map(l => l.patio)))} no pátio esperando a equipe. Isso é fila, não lentidão da descarga: o tempo de abertura do lacre deve ser medido a partir do início do turno.`));
  return out.join("");
}

function telaTurno() {
  const { P, X, B } = ctx(), base = P.prevNome;
  const pico = X.hora.reduce((a, b) => (b.media > a.media ? b : a));
  DESENHOS.push(() => {
    curva($("#g-curva"), X.hora);
    colNoites($("#g-noites"), TODOS.noite.map(n => n.total), P.ids, { cor: "var(--vol)" });
    colNoites($("#g-uph"), TODOS.noite.map(n => n.uph), P.ids, { cor: "#4a3aa7", meta: M.uph, nomeMeta: `meta ${M.uph}` });
  });
  return `${cab("Visão do Turno", "Quanto foi processado, em que ritmo e em quais horários", P)}
    <div class="kpis">
      ${kpi("Pacotes processados", fmt(X.total), `em ${X.ids.length} noite(s)`, "var(--vol)", delta(X.total, B && B.total, true, base))}
      ${kpi("Média por noite", fmt(X.total / X.ids.length), "pacotes bipados", "#1c5cab", B ? delta(X.total / X.ids.length, B.total / B.ids.length, true, base) : "")}
      ${kpi("UPH da equipe", `${fmt(X.uph)}<small>/h</small>`, `pacotes por hora por bipador · meta ${M.uph}`, "#4a3aa7", farol(X.uph, M.uph) + delta(X.uph, B && B.uph, true, base))}
      ${kpi("Bipadores ativos", fmt1(X.ativos), "por noite, em média", "var(--equipe)", delta(X.ativos, B && B.ativos, true, base))}
      ${kpi("Pico da operação", `${String(pico.h).padStart(2, "0")}h`, `${fmt(pico.media)} pacotes por noite nessa hora`, "var(--espera)")}
      ${kpi("Horas ativas", fmt(X.ha), `horas-bipador com ${M.hora_ativa}+ pacotes`, "#334155", delta(X.ha, B && B.ha, true, base))}
    </div>
    <div class="ins">${insights(X)}</div>
    <div class="row c2">
      ${card("Curva da noite", "Pacotes por hora (média por noite) e quantos bipadores estavam ativos em cada horário", `<div class="legend"><span><i style="--c:var(--vol)"></i>Pacotes por hora</span><span><i style="--c:var(--equipe)"></i>Bipadores ativos</span></div><div class="chart" id="g-curva"></div>`)}
      ${card("Como ler o UPH", "", `<div class="met"><b>UPH (unidades por hora)</b> = pacotes bipados ÷ horas efetivamente bipando.<br><br>
        Uma hora só conta como trabalhada quando a pessoa bipou pelo menos <b>${M.hora_ativa} pacotes</b>. Assim, quem ajuda pontualmente (1 ou 2 pacotes numa hora) não puxa a média para baixo, e quem bipou pouco tempo não é comparado com quem bipou a noite toda.<br><br>
        Comparar só o total de pacotes favorece quem ficou mais horas na bipagem. O UPH mede o <b>ritmo</b>, que é o que se gerencia.</div>
        <p class="nota">Meta usada: <b>${M.uph} pacotes/hora</b>. Os perfis são automáticos: <span class="tag d">Bipagem dedicada</span> (UPH ≥ 300 e 3+ horas ativas), <span class="tag a">Apoio</span> e <span class="tag e">Eventual</span>.</p>`)}
    </div>
    <div class="row c2e">
      ${card("Pacotes por noite", "Todas as noites, com o período escolhido em destaque", `<div class="chart" id="g-noites"></div>`)}
      ${card("UPH da equipe por noite", "Ritmo de bipagem contra a meta", `<div class="chart" id="g-uph"></div>`)}
    </div>`;
}

function telaEquipe() {
  const { P, X, B } = ctx();
  const lista = X.b.filter(x => x.total > 0).sort((p, q) => S.ordem === "uph" ? (q.uph || 0) - (p.uph || 0) || q.total - p.total : q.total - p.total);
  const mxU = Math.max(...lista.map(x => x.uph || 0), 1), mxT = Math.max(...lista.map(x => x.total), 1);
  const ded = X.b.filter(x => x.perfil === "d" && x.ha > 0);
  const linhas = lista.map((x, k) => {
    const xb = B ? B.b[x.k] : null;
    return `<tr><td class="l mut">${k + 1}</td><td class="l"><b>${esc(x.nome)}</b></td><td class="l"><span class="tag ${x.perfil}">${PERFIL_NOME[x.perfil]}</span></td>
      <td class="l" style="min-width:190px"><span class="barra" style="width:${(x.uph || 0) / mxU * 110}px;--c:${(x.uph || 0) >= M.uph ? "var(--good)" : x.perfil === "d" ? "var(--vol)" : "var(--espera)"}"></span><b>${x.uph ? fmt(x.uph) : "—"}</b></td>
      <td>${farol(x.uph, M.uph)}</td><td><span class="barra" style="width:${x.total / mxT * 70}px"></span>${fmt(x.total)}</td><td>${pct(x.total / X.total)}</td>
      <td>${fmt(x.ha)}</td><td>${x.noites.size}</td><td>${xb ? delta(x.uph, xb.uph, true, P.prevNome) : ""}</td></tr>`;
  }).join("");
  const comHoras = X.b.filter(x => x.ha > 0).sort((p, q) => (q.uph || 0) - (p.uph || 0));
  const mxCel = Math.max(...comHoras.flatMap(x => x.porHora.map(c => c.h ? c.q / c.h : 0)), 1);
  const cor = t => { const r = ["#f3f7fd", "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"]; const p = Math.min(1, t) * (r.length - 1), i = Math.floor(p); return { bg: r[Math.min(r.length - 1, Math.round(p))], fg: p > 3.6 ? "#fff" : "var(--ink)" }; };
  const hm = `<div class="rolar"><table class="hm"><tr><th class="r">Bipador</th>${HORAS.map(h => `<th>${String(h).padStart(2, "0")}h</th>`).join("")}<th>UPH</th></tr>
    ${comHoras.map(x => `<tr><th class="r">${esc(curto(x.nome))}</th>${x.porHora.map((c, h) => { if (!c.h) return `<td style="background:#f6f7f9;color:var(--muted)">—</td>`; const u = c.q / c.h, k = cor(u / mxCel); return `<td style="background:${k.bg};color:${k.fg};${u >= M.uph ? "box-shadow:inset 0 -3px 0 var(--good)" : ""}" data-tt="${tt(esc(x.nome) + " · " + String(h).padStart(2, "0") + "h", [["UPH na hora", fmt(u)], ["Horas ativas", fmt(c.h)], ["Pacotes", fmt(c.q)]])}">${fmt(u)}</td>`; }).join("")}<td style="font-weight:800">${fmt(x.uph)}</td></tr>`).join("")}</table></div>
    <p class="nota">UPH médio de cada pessoa em cada horário, só nas horas ativas. Quanto mais escuro, mais rápido. A linha verde embaixo da célula indica que bateu a meta de ${M.uph}.</p>`;
  DESENHOS.push(() => dispersao($("#g-disp"), X.b));
  const top = [...X.b].filter(x => x.ha).sort((p, q) => q.uph - p.uph)[0];
  return `${cab("Equipe & Produtividade", "Ranking justo por ritmo (UPH), perfil de cada bipador e desempenho por horário", P)}
    <div class="kpis">
      ${kpi("Bipadores no período", fmt(X.b.filter(x => x.total > 0).length), `${ded.length} em bipagem dedicada`, "var(--equipe)")}
      ${kpi("UPH dos dedicados", `${fmt(soma(ded.map(x => x.qa)) / (soma(ded.map(x => x.ha)) || 1))}<small>/h</small>`, `meta ${M.uph}`, "var(--vol)")}
      ${kpi("Maior UPH", top ? `${fmt(top.uph)}<small>/h</small>` : "—", top ? esc(top.nome) : "", "#4a3aa7")}
      ${kpi("Na meta", `${X.b.filter(x => x.ha && x.uph >= M.uph).length}<small>de ${X.b.filter(x => x.ha).length}</small>`, "bipadores com UPH ≥ meta", "var(--good)")}
      ${kpi("Volume do apoio", pct(soma(X.b.filter(x => x.perfil !== "d").map(x => x.total)) / (X.total || 1)), "do total bipado por apoio e eventuais", "var(--espera)")}
      ${kpi("Horas ativas", fmt(X.ha), "soma de horas-bipador", "#334155")}
    </div>
    ${card("Ranking da equipe", `Ordenado por ${S.ordem === "uph" ? "UPH (ritmo)" : "total de pacotes"} · ${P.prev ? "variação do UPH contra " + esc(P.prevNome) : ""}`, `<div class="tbl alta"><table><thead><tr><th class="l">#</th><th class="l">Bipador</th><th class="l">Perfil</th><th class="l">UPH</th><th>Meta</th><th>Pacotes</th><th>% do total</th><th>Horas ativas</th><th>Noites</th><th>Δ UPH</th></tr></thead><tbody>${linhas}</tbody></table></div>`,
      `<div class="chips"><button class="chip ${S.ordem === "uph" ? "on" : ""}" data-ordem="uph">Por UPH</button><button class="chip ${S.ordem === "total" ? "on" : ""}" data-ordem="total">Por total</button></div>`)}
    <div class="row c2e">
      ${card("Mapa de calor: bipador × horário", "Em que horário cada pessoa rende mais", hm)}
      ${card("Horas trabalhadas × ritmo", "Cada ponto é um bipador. Acima da linha vermelha, bateu a meta", `<div class="legend"><span><i style="--c:var(--vol)"></i>Bipagem dedicada</span><span><i style="--c:var(--espera)"></i>Apoio</span><span><i class="dash" style="--c:var(--bad)"></i>Meta</span></div><div class="chart" id="g-disp"></div>`)}
    </div>`;
}

function telaCarretas() {
  const { P, X, B } = ctx(), L = X.lh, LB = B ? B.lh : null;
  const pont = l => l.situ !== "atr", atr = L.filter(l => l.situ === "atr");
  const k = (arr, f) => arr && arr.length ? f(arr) : null;
  const pontual = k(L, a => a.filter(pont).length / a.length), pontualB = k(LB, a => a.filter(pont).length / a.length);
  const atrMed = k(atr, a => media(a.map(l => l.atraso))), espMed = k(L, a => media(a.map(l => l.espera))), descMed = k(L, a => media(a.map(l => l.descarga)));
  const espB = k(LB, a => media(a.map(l => l.espera))), descB = k(LB, a => media(a.map(l => l.descarga)));
  // noite do gráfico de linha do tempo
  if (S.noiteLH == null || !P.ids.includes(S.noiteLH)) S.noiteLH = [...P.ids].reverse().find(i => X.lh.some(l => l.n === i)) ?? P.ids[P.ids.length - 1];
  const daNoite = L.filter(l => l.n === S.noiteLH).sort((p, q) => p.prev - q.prev);
  // motivos (Pareto)
  const mot = {}; atr.forEach(l => (mot[l.motivo || "Não informado"] = (mot[l.motivo || "Não informado"] || 0) + 1));
  const mots = Object.entries(mot).sort((p, q) => q[1] - p[1]);
  let acc = 0;
  const pareto = mots.length ? `<div class="tbl" style="border:0"><table><thead><tr><th class="l">Motivo do atraso</th><th class="l">Carretas</th><th>%</th><th>Acum.</th></tr></thead><tbody>${mots.map(([m, n]) => { acc += n; return `<tr><td class="l"><b>${esc(m)}</b></td><td class="l"><span class="barra" style="width:${n / mots[0][1] * 160}px;--c:var(--bad)"></span>${n}</td><td>${pct(n / atr.length, 0)}</td><td class="mut">${pct(acc / atr.length, 0)}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="nota">Nenhum atraso no período. 👏</div>`;
  // distribuição de pontualidade
  const faixas = [["Antecipada (+" + M.tolerancia + " min)", l => l.atraso < -M.tolerancia, "#0ca30c"], ["No horário (±" + M.tolerancia + " min)", l => Math.abs(l.atraso) <= M.tolerancia, "#58c458"], ["Atraso até 1h", l => l.atraso > M.tolerancia && l.atraso <= 60, "#fab219"], ["Atraso de 1h a 3h", l => l.atraso > 60 && l.atraso <= 180, "#ec835a"], ["Atraso acima de 3h", l => l.atraso > 180, "#d03b3b"]];
  const dist = faixas.map(([n, f, c]) => [n, L.filter(f).length, c]);
  const distHtml = `<div style="display:flex;height:40px;border-radius:10px;overflow:hidden;gap:2px">${dist.filter(d => d[1]).map(([n, v, c]) => `<div style="flex:${v};background:${c};display:grid;place-items:center;color:#fff;font-weight:750;font-size:12px" data-tt="${tt(esc(n), [["Carretas", v, c], ["%", pct(v / L.length, 0)]])}">${v / L.length > .07 ? pct(v / L.length, 0) : ""}</div>`).join("")}</div>
    <div class="legend" style="margin-top:10px">${dist.map(([n, v, c]) => `<span><i style="--c:${c}"></i>${esc(n)}: <b>${v}</b></span>`).join("")}</div>`;
  const antes = L.filter(l => l.patio > 0), dentro = L.filter(l => l.patio <= 0);
  DESENHOS.push(() => gantt($("#g-gantt"), daNoite));
  const chipsNoite = P.ids.length > 1 ? `<div class="chips">${P.ids.filter(i => X.lh.some(l => l.n === i)).map(i => `<button class="chip ${i === S.noiteLH ? "on" : ""}" data-noite="${i}">${nomeNoite(i)}</button>`).join("")}</div>` : "";
  return `${cab("Chegada das Carretas", "Pontualidade, motivos de atraso e o tempo de cada etapa: chegada → abertura do lacre → descarga", P)}
    <div class="kpis">
      ${kpi("Carretas recebidas", fmt(L.length), `${fmt(soma(L.map(l => l.piso)))} pacotes em piso`, "var(--vol)", delta(L.length, LB && LB.length, true, P.prevNome))}
      ${kpi("Pontualidade", pct(pontual, 0), `chegaram até ${M.tolerancia} min do previsto`, "var(--good)", farol(pontual, .8) + delta(pontual, pontualB, true, P.prevNome))}
      ${kpi("Carretas atrasadas", fmt(atr.length), `mais de ${M.tolerancia} min depois do previsto`, "var(--bad)")}
      ${kpi("Atraso médio", dur(atrMed), "só das atrasadas (sem compensar com as antecipadas)", "#ec835a")}
      ${kpi("Espera p/ abrir lacre", dur(espMed), `desde que a carreta está disponível · meta ${M.lacre} min`, "var(--espera)", farol(espMed, M.lacre, false) + delta(espMed, espB, false, P.prevNome))}
      ${kpi("Descarga média", dur(descMed), `da abertura do lacre ao fim · meta ${M.descarga} min`, "var(--desc)", farol(descMed, M.descarga, false) + delta(descMed, descB, false, P.prevNome))}
    </div>
    ${card("Linha do tempo das carretas", `${nomeNoite(S.noiteLH)} · cada linha é uma carreta, do horário previsto ao fim da descarga`, `${chipsNoite}<div class="legend" style="margin-top:8px"><span><i class="dia" style="--c:var(--ink)"></i>Previsto</span><span><i style="--c:var(--bad)"></i>Chegou atrasada</span><span><i style="--c:var(--good)"></i>Chegou antes</span><span><i style="--c:var(--patio)"></i>No pátio aguardando o turno</span><span><i style="--c:var(--espera)"></i>Espera para abrir o lacre</span><span><i style="--c:var(--desc)"></i>Descarga</span></div><div class="chart" id="g-gantt"></div>`)}
    <div class="row c2e">
      ${card("Por que as carretas atrasam?", `Pareto dos motivos · ${atr.length} carreta(s) atrasada(s)`, pareto)}
      ${card("Pontualidade das chegadas", "Distribuição do atraso em relação ao horário previsto", distHtml + `<div class="met" style="margin-top:14px"><b>Fila × lentidão.</b> ${antes.length} carreta(s) chegaram <b>antes do turno</b> e esperaram em média <b>${dur(media(antes.map(l => l.patio)))}</b> no pátio. Mas, depois que o turno começa, a espera para abrir o lacre é de <b>${dur(media(L.map(l => l.espera)))}</b>. Medir o lacre a partir da chegada misturaria as duas coisas e faria a equipe parecer lenta.</div>`)}
    </div>`;
}

function telaDados() {
  const { P, X } = ctx();
  const bipRows = D.bip.filter(r => P.ids.includes(r[0])).sort((a, b) => a[0] - b[0] || a[2] - b[2] || b[3] - a[3]);
  return `${cab("Dados do período", "Tudo o que alimenta o painel, para conferir e exportar", P)}
    <div class="row c2e">
      ${card("Bipagem por hora", `${fmt(bipRows.length)} registros · horas com menos de ${M.hora_ativa} pacotes aparecem em cinza (não contam no UPH)`, `<div class="tbl alta"><table><thead><tr><th class="l">Noite</th><th class="l">Bipador</th><th>Hora</th><th>Pacotes</th></tr></thead><tbody>${bipRows.map(r => `<tr class="${r[3] < M.hora_ativa ? "mut" : ""}"><td class="l">${nomeNoite(r[0])}</td><td class="l">${esc(D.bipadores[r[1]])}</td><td>${String(r[2]).padStart(2, "0")}h</td><td>${fmt(r[3])}</td></tr>`).join("")}</tbody></table></div>`, `<button class="btn" data-csv="bip">Exportar CSV</button>`)}
      ${card("Carretas", `${X.lh.length} carreta(s)`, `<div class="tbl alta"><table><thead><tr><th class="l">Carreta</th><th class="l">Noite</th><th>Previsto</th><th>Chegada</th><th>Atraso</th><th>Lacre</th><th>Espera</th><th>Descarga</th><th>Piso</th><th class="l">Motivo</th></tr></thead><tbody>${X.lh.map(l => `<tr><td class="l"><b>${esc(l.lh)}</b></td><td class="l">${nomeNoite(l.n)}</td><td>${relogio(l.prev)}</td><td>${relogio(l.cheg)}</td><td style="color:${l.situ === "atr" ? "var(--bad-ink)" : "var(--good-ink)"};font-weight:700">${l.atraso > 0 ? "+" : ""}${dur(l.atraso)}</td><td>${relogio(l.lacre)}</td><td>${dur(l.espera)}</td><td>${dur(l.descarga)}</td><td>${fmt(l.piso)}</td><td class="l mut">${esc(l.motivo || "—")}</td></tr>`).join("")}</tbody></table></div>`, `<button class="btn" data-csv="lh">Exportar CSV</button>`)}
    </div>`;
}
function exportar(tipo) {
  const { P, X } = ctx(), n2 = v => String(v).replace(".", ",");
  const linhas = tipo === "bip"
    ? [["Noite", "Bipador", "Hora", "Pacotes", "Hora ativa"], ...D.bip.filter(r => P.ids.includes(r[0])).map(r => [D.noites[r[0]], D.bipadores[r[1]], r[2], r[3], r[3] >= M.hora_ativa ? "sim" : "não"])]
    : [["Carreta", "Noite", "Previsto", "Chegada", "Atraso (min)", "Abertura lacre", "Espera (min)", "Descarga (min)", "Pacotes em piso", "Motivo"], ...X.lh.map(l => [l.lh, D.noites[l.n], relogio(l.prev), relogio(l.cheg), l.atraso, relogio(l.lacre), l.espera, l.descarga, l.piso, l.motivo || ""])];
  const csv = "﻿" + linhas.map(r => r.map(v => `"${n2(v ?? "")}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `${tipo === "bip" ? "Bipagem" : "Carretas"} - ${P.nome}.csv`; a.click();
}

/* ---------------- render ---------------- */
const TABS = [["turno", "Visão do Turno", '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>'], ["equipe", "Equipe & Produtividade", '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>'], ["carretas", "Chegada das Carretas", '<path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>'], ["dados", "Dados", '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>']];
const TELAS = { turno: telaTurno, equipe: telaEquipe, carretas: telaCarretas, dados: telaDados };
function render(manter) {
  const y = scrollY; DESENHOS.length = 0; tip.hidden = true;
  $("#app").innerHTML = TELAS[S.tab]();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  DESENHOS.forEach(f => f());
  if (manter) scrollTo(0, y);
}
$("#tabs").innerHTML = TABS.map(([k, n, ic]) => `<button class="tab" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}</button>`).join("");
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) { S.tab = t.dataset.tab; render(); scrollTo({ top: 0 }); } });
$("#per").innerHTML = PER.map((p, i) => `<option value="${i}">${esc(p.nome)}</option>`).join("");
$("#per").addEventListener("change", e => { S.per = +e.target.value; S.noiteLH = null; render(true); });
$("#app").addEventListener("click", e => {
  const o = e.target.closest("[data-ordem]"); if (o) { S.ordem = o.dataset.ordem; return render(true); }
  const n = e.target.closest("[data-noite]"); if (n) { S.noiteLH = +n.dataset.noite; return render(true); }
  const c = e.target.closest("[data-csv]"); if (c) exportar(c.dataset.csv);
});
if (TELAS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
$("#logo").innerHTML = LOGO ? `<img src="${LOGO}" alt="Lucas Rodrigues · Analista de Dados & BI">` : "<b>Lucas Rodrigues</b>";
$("#gerado").textContent = `${NN} noites · ${NB} bipadores · ${D.lh.length} carretas · gerado em ${D.gerado}`;
render();
</script>
</body>
</html>

const brlC = v => Math.abs(v) >= 1e6 ? "R$ " + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi" : Math.abs(v) >= 1e3 ? "R$ " + (v / 1e3).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " mil" : brl0(v);
const fmt = v => Math.round(v).toLocaleString("pt-BR");
const fmt1 = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (v, d = 1) => v == null || !isFinite(v) ? "—" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const soma = a => a.reduce((x, y) => x + y, 0);
const div = (a, b) => b ? a / b : null;

/* ---------------- agregação ---------------- */
function agg(meses, unis) {
  const M = new Set(meses), U = new Set(unis), ok = r => M.has(r[1]) && U.has(r[0]);
  const P = D.pros.map(([nome, func], k) => ({ k, nome, func, atend: 0, novos: 0, dist: 0, servR: 0, nserv: 0, prodR: 0, nprod: 0, unis: new Set() }));
  D.p.filter(ok).forEach(r => { const x = P[r[2]]; x.atend += r[3]; x.novos += r[4]; x.dist += r[5]; x.servR += r[6]; x.nserv += r[7]; x.prodR += r[8]; x.nprod += r[9]; x.unis.add(r[0]); });
  P.forEach(x => { x.total = x.servR + x.prodR; x.ticket = div(x.total, x.atend); x.prodAt = div(x.nprod, x.atend); x.retorno = x.dist ? 1 - x.novos / x.dist : null; });
  const S = D.servicos.map(([nome, cat], k) => ({ k, nome, cat, qtd: 0, cli: 0, valor: 0 }));
  D.s.filter(ok).forEach(r => { const x = S[r[2]]; x.qtd += r[3]; x.cli += r[4]; x.valor += r[5]; });
  const R = D.produtos.map(([nome, cat], k) => ({ k, nome, cat, qtd: 0, valor: 0 }));
  D.r.filter(ok).forEach(r => { const x = R[r[2]]; x.qtd += r[3]; x.valor += r[4]; });
  const cats = (lista, ordem) => ordem.map(c => { const it = lista.filter(x => x.cat === c); return { cat: c, valor: soma(it.map(x => x.valor)), qtd: soma(it.map(x => x.qtd)), itens: it.filter(x => x.qtd).sort((a, b) => b.valor - a.valor) }; });
  const t = {
    servR: soma(P.map(x => x.servR)), prodR: soma(P.map(x => x.prodR)), atend: soma(P.map(x => x.atend)), novos: soma(P.map(x => x.novos)),
    dist: soma(P.map(x => x.dist)), nserv: soma(P.map(x => x.nserv)), nprod: soma(P.map(x => x.nprod)),
  };
  t.total = t.servR + t.prodR; t.ticket = div(t.total, t.atend); t.pctProd = div(t.prodR, t.total); t.prod100 = div(t.nprod * 100, t.atend);
  const tecnicos = P.filter(x => x.nserv > 0);
  return { P, S, R, t, tecnicos, cS: cats(S, D.catServicos), cR: cats(R, D.catProdutos), servTot: soma(S.map(x => x.valor)), servQtd: soma(S.map(x => x.qtd)), prodTot: soma(R.map(x => x.valor)), prodQtd: soma(R.map(x => x.qtd)) };
}
const CACHE = {};
const A = (m, u) => { const k = m.join() + "|" + u.join(); return CACHE[k] || (CACHE[k] = agg(m, u)); };
const TODAS_U = D.unidades.map((_, i) => i);

/* ---------------- estado ---------------- */
const PER = [...D.meses.map((_, k) => ({ nome: nomeMes(k), m: [k], prev: k ? [k - 1] : null, prevNome: k ? nomeMes(k - 1) : "" })),
  { nome: `Todos os meses (${curtoMes(0)} a ${curtoMes(NM - 1)})`, m: D.meses.map((_, k) => k), prev: null }];
const S = { tab: "geral", per: NM - 1, uni: -1, ordem: "total" };
const ctx = () => { const P = PER[S.per], u = S.uni < 0 ? TODAS_U : [S.uni]; return { P, u, X: A(P.m, u), B: P.prev ? A(P.prev, u) : null, nomeU: S.uni < 0 ? "Todas as unidades" : D.unidades[S.uni] }; };

/* ---------------- tooltips ---------------- */
const tip = $("#tip");
function mover(e) { const r = tip.getBoundingClientRect(); let x = e.clientX + 16, y = e.clientY + 16; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 16; if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8); tip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`; }
document.addEventListener("mouseover", e => {
  const c = e.target.closest("[data-cat]");
  if (c) { tip.className = "foto"; tip.innerHTML = cartaoFoto(c.dataset.tipo, c.dataset.cat); tip.hidden = false; mover(e); return; }
  const el = e.target.closest("[data-tt]");
  if (!el) { tip.hidden = true; return; }
  tip.className = ""; tip.innerHTML = el.dataset.tt; tip.hidden = false; mover(e);
});
document.addEventListener("mousemove", e => { if (!tip.hidden) mover(e); });
const tt = (t, linhas) => esc(`<div class="tt-h">${t}</div>` + linhas.map(([n, v, c]) => `<div class="tt-r"><i style="--c:${c || "transparent"}"></i><span>${n}</span><b>${v}</b></div>`).join(""));
function cartaoFoto(tipo, cat) {
  const { X, B } = ctx(), lista = tipo === "s" ? X.cS : X.cR, c = lista.find(x => x.cat === cat), cb = B ? (tipo === "s" ? B.cS : B.cR).find(x => x.cat === cat) : null;
  const ticket = div(c.valor, c.qtd), tot = tipo === "s" ? X.servTot : X.prodTot;
  return `<div class="tf-img" style="background-image:url('${D.fotos[cat] || ""}')"><b>${esc(cat)}</b><span>${cb ? delta(c.valor, cb.valor, true) : ""}</span></div>
    <div class="tf-k"><div><b>${brlC(c.valor)}</b><small>Faturamento</small></div><div><b>${ticket ? brl(ticket) : "—"}</b><small>${tipo === "s" ? "Ticket médio" : "Preço médio"}</small></div><div><b>${fmt(c.qtd)}</b><small>${tipo === "s" ? "Serviços" : "Unidades"}</small></div></div>
    <div class="tf-top"><p>${pct(div(c.valor, tot))} do faturamento de ${tipo === "s" ? "serviços" : "produtos"} · mais vendidos</p>${c.itens.slice(0, 3).map(i => `<div><span>${esc(i.nome)}</span><b>${brlC(i.valor)}</b></div>`).join("") || "<div>Sem vendas no período</div>"}</div>`;
}

/* ---------------- peças ---------------- */
function delta(cur, prev, bomSubir = true) {
  if (prev == null || cur == null || !prev) return "";
  const v = (cur - prev) / Math.abs(prev);
  if (Math.abs(v) < .0005) return `<span class="delta eq">=</span>`;
  return `<span class="delta ${(v > 0) === bomSubir ? "bom" : "ruim"}">${v > 0 ? "▲" : "▼"} ${pct(Math.abs(v))}</span>`;
}
const kpi = (nome, valor, sub, cor, extra = "", cls = "") => `<div class="kpi ${cls}" style="--c:${cor}"><div class="kpi-l">${nome}</div><div class="kpi-v">${valor}</div><div class="kpi-s">${sub}</div><div class="kpi-f">${extra}</div></div>`;
const card = (t, s, corpo, acao = "") => `<section class="card"><div class="card-h"><div><h3>${t}</h3>${s ? `<p>${s}</p>` : ""}</div>${acao}</div>${corpo}</section>`;
const ins = (nivel, ic, t, p) => `<div class="in ${nivel}"><span class="ic">${ic}</span><b>${t}</b><p>${p}</p></div>`;
function cab(t, s, extra = "") { const { P, nomeU } = ctx(); return `<div class="sec-h"><div><h2>${t}</h2><p>${s}</p></div><div class="badges"><span class="badge">${esc(P.nome)}</span><span class="badge cinza">${esc(nomeU)}</span>${P.prev ? `<span class="badge cinza">vs ${esc(P.prevNome)}</span>` : ""}${extra}</div></div>`; }
function galeria(tipo, lista, tot, B) {
  const ord = lista.filter(c => c.valor > 0).sort((a, b) => b.valor - a.valor);
  return `<div class="galeria">${ord.map((c, i) => { const cb = B ? (tipo === "s" ? B.cS : B.cR).find(x => x.cat === c.cat) : null; return `<div class="cat" data-tipo="${tipo}" data-cat="${esc(c.cat)}">${D.fotos[c.cat] ? `<img src="${D.fotos[c.cat]}" alt="">` : ""}<span class="rk">${i + 1}º</span><span class="dv">${cb ? delta(c.valor, cb.valor) : ""}</span><div class="tx"><b>${esc(c.cat)}</b><span>${brlC(c.valor)}</span><small>${pct(c.valor / tot)} · ${fmt(c.qtd)} ${tipo === "s" ? "serviços" : "unid."}</small></div></div>`; }).join("")}</div>`;
}
function barrasCat(tipo, lista, cor) {
  const ord = lista.filter(c => c.valor > 0).sort((a, b) => b.valor - a.valor), mx = ord[0] ? ord[0].valor : 1, tot = soma(ord.map(c => c.valor));
  return `<div class="hb">${ord.map(c => `<div class="hb-r" data-tipo="${tipo}" data-cat="${esc(c.cat)}"><div class="hb-l">${D.fotos[c.cat] ? `<img src="${D.fotos[c.cat]}" alt="">` : ""}<span>${esc(c.cat)}</span></div><div class="hb-t"><i style="--w:${c.valor / mx};--c:${cor}"></i></div><div class="hb-v">${brl0(c.valor)}<small>${pct(c.valor / tot)} · ticket ${brl0(div(c.valor, c.qtd) || 0)}</small></div></div>`).join("")}</div>`;
}
function barrasItens(lista, cor, n = 12, tipo) {
  const ord = lista.filter(x => x.valor > 0).sort((a, b) => b.valor - a.valor).slice(0, n), mx = ord[0] ? ord[0].valor : 1;
  return `<div class="hb">${ord.map((x, i) => `<div class="hb-r" data-tipo="${tipo}" data-cat="${esc(x.cat)}"><div class="hb-l"><i style="--c:${cor}"></i><span><b style="color:var(--muted);font-weight:600">${i + 1}.</b> ${esc(x.nome)}</span></div><div class="hb-t"><i style="--w:${x.valor / mx};--c:${cor}"></i></div><div class="hb-v">${brl0(x.valor)}<small>${fmt(x.qtd)} × ${brl0(x.valor / x.qtd)}</small></div></div>`).join("")}</div>`;
}

const DESENHOS = [];
let tmr; addEventListener("resize", () => { clearTimeout(tmr); tmr = setTimeout(() => DESENHOS.forEach(f => f()), 120); });
function eixo(maxV, n = 4) { const bruto = maxV / n, mag = Math.pow(10, Math.floor(Math.log10(bruto || 1))); const p = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= bruto); const out = []; for (let v = 0; v <= maxV + p * .5; v += p) out.push(v); return out; }

// colunas empilhadas por mês (serviços + produtos)
function colMeses(el, sel) {
  const W = el.clientWidth || 700, H = 260, pl = 60, pr = 10, pt = 24, pb = 30, u = S.uni < 0 ? TODAS_U : [S.uni];
  const ms = D.meses.map((_, k) => A([k], u).t), mx = Math.max(...ms.map(t => t.total), 1), tk = eixo(mx), top = tk[tk.length - 1];
  const bw = (W - pl - pr) / NM, w = Math.min(70, bw * .55), y = v => pt + (H - pt - pb) * (1 - v / top), s = new Set(sel);
  let o = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tk.forEach(v => (o += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${brlC(v).replace("R$ ", "")}</text>`));
  ms.forEach((t, k) => {
    const cx = pl + k * bw + bw / 2, on = s.has(k), op = on ? 1 : .35;
    o += `<g data-tt="${tt(nomeMes(k), [["Serviços", brl0(t.servR), "var(--serv)"], ["Produtos", brl0(t.prodR), "var(--prod)"], ["Total", brl0(t.total)], ["Atendimentos", fmt(t.atend)], ["Ticket médio", brl(t.ticket || 0)]])}"><rect x="${cx - bw / 2}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>
      <rect x="${cx - w / 2}" y="${y(t.servR)}" width="${w}" height="${y(0) - y(t.servR)}" fill="var(--serv)" opacity="${op}" rx="3"/>
      <rect x="${cx - w / 2}" y="${y(t.total)}" width="${w}" height="${Math.max(0, y(t.servR) - y(t.total) - 2)}" fill="var(--prod)" opacity="${op}" rx="3"/>
      <text class="lbl" x="${cx}" y="${y(t.total) - 6}" text-anchor="middle" opacity="${on ? 1 : .6}">${brlC(t.total).replace("R$ ", "")}</text>
      <text class="ax" x="${cx}" y="${H - 10}" text-anchor="middle" style="${on ? "font-weight:800;fill:var(--ink)" : ""}">${curtoMes(k)}</text></g>`;
  });
  el.innerHTML = o + "</svg>";
}
// dispersão atendimentos x ticket (bolha = faturamento)
function bolhas(el, P) {
  const pts = P.filter(x => x.nserv > 0 && x.atend > 0), W = el.clientWidth || 600, H = 320, pl = 56, pr = 18, pt = 16, pb = 38;
  const mxX = Math.max(...pts.map(p => p.atend), 1) * 1.08, mxY = Math.max(...pts.map(p => p.ticket), 1) * 1.1, mxT = Math.max(...pts.map(p => p.total), 1);
  const tkX = eixo(mxX, 5), tkY = eixo(mxY), tX = tkX[tkX.length - 1], tY = tkY[tkY.length - 1];
  const x = v => pl + v / tX * (W - pl - pr), y = v => pt + (H - pt - pb) * (1 - v / tY);
  const medX = soma(pts.map(p => p.atend)) / pts.length, medY = soma(pts.map(p => p.total)) / soma(pts.map(p => p.atend));
  let o = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tkY.forEach(v => (o += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${brl0(v).replace("R$ ", "")}</text>`));
  tkX.forEach(v => (o += `<text class="ax" x="${x(v)}" y="${H - 20}" text-anchor="middle">${fmt(v)}</text>`));
  o += `<text class="ax" x="${(pl + W - pr) / 2}" y="${H - 3}" text-anchor="middle" style="font-weight:700">atendimentos no período</text><text class="ax" x="${pl - 8}" y="${pt - 4}" text-anchor="end" style="font-weight:700">ticket</text>`;
  o += `<line x1="${x(medX)}" x2="${x(medX)}" y1="${pt}" y2="${H - pb}" stroke="var(--axis)" stroke-dasharray="4 4"/><line x1="${pl}" x2="${W - pr}" y1="${y(medY)}" y2="${y(medY)}" stroke="var(--axis)" stroke-dasharray="4 4"/>`;
  o += `<text class="ax" x="${W - pr}" y="${pt + 10}" text-anchor="end" style="font-weight:700;fill:var(--brand-ink)">muito atendimento · ticket alto</text><text class="ax" x="${pl + 6}" y="${H - pb - 6}" style="font-weight:700">pouco atendimento · ticket baixo</text>`;
  const cor = f => /Manicure$/.test(f) ? "#d4789e" : /Manicure\//.test(f) ? "#b7892f" : /Maquiad/.test(f) ? "#7c3aed" : "#9d174d";
  const rotular = new Set([...pts].sort((a, b) => b.total - a.total).slice(0, 8).map(p => p.k));
  [...pts].sort((a, b) => b.total - a.total).forEach(p => {
    const r = 5 + 15 * Math.sqrt(p.total / mxT);
    o += `<g data-tt="${tt(esc(p.nome), [["Função", esc(p.func)], ["Faturamento", brl0(p.total), cor(p.func)], ["Atendimentos", fmt(p.atend)], ["Ticket médio", brl(p.ticket)], ["Produtos / 100 atend.", fmt1(p.prodAt * 100)]])}"><circle cx="${x(p.atend)}" cy="${y(p.ticket)}" r="${r}" fill="${cor(p.func)}" fill-opacity=".72" stroke="#fff" stroke-width="2"/>${rotular.has(p.k) ? `<text class="lbl" x="${x(p.atend)}" y="${y(p.ticket) - r - 4}" text-anchor="middle" style="font-size:10.5px">${esc(p.nome.split(" ")[0])}</text>` : ""}</g>`;
  });
  el.innerHTML = o + "</svg>";
}

/* ---------------- telas ---------------- */
function insights(X, B, P) {
  const out = [], t = X.t, tec = [...X.tecnicos].sort((a, b) => b.total - a.total);
  const top3 = soma(tec.slice(0, 3).map(x => x.total)) / (t.total || 1);
  out.push(ins(top3 > .35 ? "aten" : "info", "◔", `3 profissionais fazem ${pct(top3, 0)} do faturamento`, `${tec.slice(0, 3).map(x => esc(x.nome)).join(", ")}. ${top3 > .35 ? "Dependência alta: a saída de uma delas pesa no caixa. Vale um plano de retenção e de desenvolvimento da equipe." : "A receita está bem distribuída."}`));
  out.push(ins(t.prod100 < 10 ? "gold" : "ok", "🛍", `${fmt1(t.prod100)} produtos a cada 100 atendimentos`, `Produtos são ${pct(t.pctProd)} do faturamento. Se cada profissional vendesse 1 produto a cada 10 atendimentos, seriam cerca de <b>${brl0(Math.max(0, t.atend * .1 - t.nprod) * (div(t.prodR, t.nprod) || 100))}</b> a mais no período.`));
  const cs = X.cS.filter(c => c.valor).sort((a, b) => b.valor - a.valor);
  if (cs[0]) out.push(ins("info", "★", `${esc(cs[0].cat)} lidera os serviços`, `${brl0(cs[0].valor)} (${pct(cs[0].valor / X.servTot, 0)} dos serviços), com ticket médio de ${brl(cs[0].valor / cs[0].qtd)}.`));
  if (B) {
    const v = div(t.total - B.t.total, B.t.total), vt = div(t.ticket - B.t.ticket, B.t.ticket);
    out.push(ins(v >= 0 ? "ok" : "crit", v >= 0 ? "▲" : "▼", `Faturamento ${v >= 0 ? "cresceu" : "caiu"} ${pct(Math.abs(v))} sobre ${esc(P.prevNome)}`, `${brl0(B.t.total)} → ${brl0(t.total)}. Ticket médio ${vt >= 0 ? "subiu" : "caiu"} ${pct(Math.abs(vt))} e os atendimentos ${t.atend >= B.t.atend ? "subiram" : "caíram"} ${pct(Math.abs(div(t.atend - B.t.atend, B.t.atend)))}.`));
    const mud = X.cS.map(c => { const b = B.cS.find(x => x.cat === c.cat); return { c, d: c.valor - (b ? b.valor : 0) }; }).sort((a, b) => b.d - a.d);
    if (mud[0] && mud[0].d > 0) out.push(ins("ok", "↗", `${esc(mud[0].c.cat)} foi a que mais cresceu`, `+${brl0(mud[0].d)} em relação ao mês anterior.`));
    const pior = mud[mud.length - 1];
    if (pior && pior.d < 0) out.push(ins("aten", "↘", `${esc(pior.c.cat)} perdeu ${brl0(-pior.d)}`, "Maior queda entre as categorias de serviço. Vale olhar agenda, equipe e promoções da categoria."));
  }
  const ret = 1 - t.novos / (t.dist || 1);
  out.push(ins(ret >= .75 ? "ok" : "aten", "↺", `${pct(ret, 0)} das clientes já eram da casa`, `${fmt(t.novos)} clientes novas no período. ${ret >= .75 ? "Boa fidelização." : "Fidelização abaixo de 75%: avaliar pós-venda e pacotes."}`));
  return out.join("");
}

function telaGeral() {
  const { P, X, B } = ctx(), t = X.t, b = B ? B.t : null;
  DESENHOS.push(() => colMeses($("#g-meses"), P.m));
  const porU = D.unidades.map((nome, i) => ({ nome, t: A(P.m, [i]).t }));
  const mxU = Math.max(...porU.map(x => x.t.total), 1);
  const unidades = `<div class="hb">${porU.map(x => `<div class="hb-r" data-tt="${tt(esc(x.nome), [["Faturamento", brl0(x.t.total)], ["Serviços", brl0(x.t.servR), "var(--serv)"], ["Produtos", brl0(x.t.prodR), "var(--prod)"], ["Atendimentos", fmt(x.t.atend)], ["Ticket médio", brl(x.t.ticket || 0)]])}"><div class="hb-l"><span>${esc(x.nome)}</span></div><div class="hb-t" style="display:flex;gap:2px"><i style="--w:${x.t.servR / mxU};--c:var(--serv)"></i><i style="--w:${x.t.prodR / mxU};--c:var(--prod)"></i></div><div class="hb-v">${brl0(x.t.total)}<small>ticket ${brl(x.t.ticket || 0)} · ${pct(x.t.pctProd)} produtos</small></div></div>`).join("")}</div>`;
  return `${cab("Visão Geral", "Faturamento, atendimentos e o que mais vende no salão")}
    <div class="kpis">
      ${kpi("Faturamento total", brlC(t.total), `serviços + produtos`, "", delta(t.total, b && b.total), "hero")}
      ${kpi("Serviços", brlC(t.servR), `<b>${pct(t.servR / (t.total || 1))}</b> do faturamento`, "var(--serv)", delta(t.servR, b && b.servR))}
      ${kpi("Produtos", brlC(t.prodR), `<b>${pct(t.pctProd)}</b> do faturamento`, "var(--prod)", delta(t.prodR, b && b.prodR))}
      ${kpi("Atendimentos", fmt(t.atend), `${fmt(t.nserv)} serviços realizados`, "#57534e", delta(t.atend, b && b.atend))}
      ${kpi("Ticket médio", brl(t.ticket || 0), "por atendimento", "#7c3aed", delta(t.ticket, b && b.ticket))}
      ${kpi("Clientes novas", fmt(t.novos), `<b>${pct(t.novos / (t.dist || 1), 0)}</b> das clientes atendidas`, "#d4789e", delta(t.novos, b && b.novos))}
    </div>
    <div class="ins">${insights(X, B, P)}</div>
    <div class="row c2">
      ${card("Faturamento por mês", "Serviços e produtos · o período escolhido fica em destaque", `<div class="legend"><span><i style="--c:var(--serv)"></i>Serviços</span><span><i style="--c:var(--prod)"></i>Produtos</span></div><div class="chart" id="g-meses"></div>`)}
      ${card("Unidades", "Comparação entre as lojas no período", unidades + `<div class="tbl" style="margin-top:14px"><table><thead><tr><th class="l">Indicador</th>${porU.map(x => `<th>${esc(x.nome.replace(/^Unidade /i, ""))}</th>`).join("")}</tr></thead><tbody>
        ${[["Atendimentos", t => fmt(t.atend)], ["Ticket médio", t => brl(t.ticket || 0)], ["Serviços por atendimento", t => fmt1(div(t.nserv, t.atend) || 0)], ["Produtos / 100 atend.", t => fmt1(t.prod100 || 0)], ["Clientes novas", t => `${fmt(t.novos)} (${pct(t.novos / (t.dist || 1), 0)})`]].map(([n, f]) => `<tr><td class="l">${n}</td>${porU.map(x => `<td>${f(x.t)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)}
    </div>
    ${card("Serviços por categoria", "Passe o mouse em uma categoria para ver faturamento, ticket e os serviços mais vendidos", galeria("s", X.cS, X.servTot, B))}`;
}

function telaPros() {
  const { P, X, B } = ctx(), tec = X.tecnicos;
  const lista = X.P.filter(x => x.total > 0 || x.atend > 0).sort((a, b) => S.ordem === "ticket" ? (b.ticket || 0) - (a.ticket || 0) : S.ordem === "prod" ? (b.prodAt || 0) - (a.prodAt || 0) : b.total - a.total);
  const mxT = Math.max(...lista.map(x => x.total), 1);
  const linhas = lista.map((x, i) => { const xb = B ? B.P[x.k] : null; return `<tr><td class="l mut">${i + 1}</td><td class="l"><b>${esc(x.nome)}</b></td><td class="l"><span class="func">${esc(x.func)}</span></td>
    <td class="l" style="min-width:170px"><span class="barra" style="width:${x.total / mxT * 100}px"></span><b>${brl0(x.total)}</b></td><td>${pct(x.total / (X.t.total || 1))}</td>
    <td>${brl0(x.servR)}</td><td>${brl0(x.prodR)}</td><td>${fmt(x.atend)}</td><td><b>${x.ticket ? brl(x.ticket) : "—"}</b></td>
    <td style="color:${(x.prodAt || 0) >= .1 ? "var(--good-ink)" : "inherit"}">${x.atend ? fmt1(x.prodAt * 100) : "—"}</td><td>${x.retorno != null ? pct(x.retorno, 0) : "—"}</td><td>${xb && xb.total ? delta(x.total, xb.total) : ""}</td></tr>`; }).join("");
  const funcs = {}; X.P.forEach(x => { if (!x.total) return; const f = funcs[x.func] || (funcs[x.func] = { total: 0, n: 0, atend: 0 }); f.total += x.total; f.n++; f.atend += x.atend; });
  const fl = Object.entries(funcs).sort((a, b) => b[1].total - a[1].total), mxF = fl[0] ? fl[0][1].total : 1;
  const porFunc = `<div class="hb">${fl.map(([f, v]) => `<div class="hb-r" data-tt="${tt(esc(f), [["Faturamento", brl0(v.total)], ["Pessoas", v.n], ["Média por pessoa", brl0(v.total / v.n)], ["Atendimentos", fmt(v.atend)]])}"><div class="hb-l"><span>${esc(f)}</span></div><div class="hb-t"><i style="--w:${v.total / mxF}"></i></div><div class="hb-v">${brl0(v.total)}<small>${v.n} pessoa(s) · ${brl0(v.total / v.n)}/pessoa</small></div></div>`).join("")}</div>`;
  const vend = [...X.P].filter(x => x.prodR > 0).sort((a, b) => b.prodR - a.prodR).slice(0, 8), mxV = vend[0] ? vend[0].prodR : 1;
  DESENHOS.push(() => bolhas($("#g-bolhas"), X.P));
  const top = [...tec].sort((a, b) => b.total - a.total)[0], topTk = [...tec].filter(x => x.atend >= 20).sort((a, b) => b.ticket - a.ticket)[0];
  return `${cab("Profissionais", "Quem fatura, como fatura (volume ou ticket) e quem vende produto")}
    <div class="kpis">
      ${kpi("Profissionais ativas", fmt(X.P.filter(x => x.total > 0 || x.atend > 0).length), `${tec.length} com serviços realizados`, "var(--brand)")}
      ${kpi("Faturamento médio", brlC(soma(tec.map(x => x.total)) / (tec.length || 1)), "por profissional técnica", "var(--gold)")}
      ${kpi("Maior faturamento", top ? brlC(top.total) : "—", top ? esc(top.nome) : "", "#7c3aed")}
      ${kpi("Maior ticket", topTk ? brl(topTk.ticket) : "—", topTk ? `${esc(topTk.nome)} (20+ atend.)` : "", "#d4789e")}
      ${kpi("Vendem produto", `${X.P.filter(x => x.nprod > 0).length}<small>de ${X.P.filter(x => x.atend > 0).length}</small>`, "profissionais com venda no período", "var(--prod)")}
      ${kpi("Fidelização", pct(1 - X.t.novos / (X.t.dist || 1), 0), "clientes que já eram da casa", "var(--good)")}
    </div>
    ${card("Ranking da equipe", `Ordenado por ${S.ordem === "ticket" ? "ticket médio" : S.ordem === "prod" ? "produtos a cada 100 atendimentos" : "faturamento"}${B ? " · variação contra " + esc(P.prevNome) : ""}`,
      `<div class="tbl alta"><table><thead><tr><th class="l">#</th><th class="l">Profissional</th><th class="l">Função</th><th class="l">Faturamento</th><th>% total</th><th>Serviços</th><th>Produtos</th><th>Atend.</th><th>Ticket</th><th title="Produtos vendidos a cada 100 atendimentos">Prod./100</th><th>Retorno</th><th>Δ</th></tr></thead><tbody>${linhas}</tbody></table></div>`,
      `<div class="chips"><button class="chip ${S.ordem === "total" ? "on" : ""}" data-ordem="total">Faturamento</button><button class="chip ${S.ordem === "ticket" ? "on" : ""}" data-ordem="ticket">Ticket</button><button class="chip ${S.ordem === "prod" ? "on" : ""}" data-ordem="prod">Venda de produto</button></div>`)}
    <div class="row c2">
      ${card("Volume × ticket", "Cada bolha é uma profissional; o tamanho é o faturamento. As linhas tracejadas são as médias da equipe", `<div class="legend"><span><i style="--c:#9d174d"></i>Cabeleireira</span><span><i style="--c:#b7892f"></i>Manicure/Cabeleireira</span><span><i style="--c:#d4789e"></i>Manicure</span><span><i style="--c:#7c3aed"></i>Maquiadora</span></div><div class="chart" id="g-bolhas"></div>`)}
      <div style="display:flex;flex-direction:column;gap:18px">
        ${card("Faturamento por função", "", porFunc)}
        ${card("Quem mais vende produto", "Top 8 em faturamento de produtos", `<div class="hb">${vend.map(x => `<div class="hb-r"><div class="hb-l"><i style="--c:var(--prod)"></i><span>${esc(x.nome)}</span></div><div class="hb-t"><i style="--w:${x.prodR / mxV};--c:var(--prod)"></i></div><div class="hb-v">${brl0(x.prodR)}<small>${fmt(x.nprod)} unid. · ${x.atend ? fmt1(x.prodAt * 100) : "—"}/100 atend.</small></div></div>`).join("")}</div>`)}
      </div>
    </div>`;
}

function telaServicos() {
  const { P, X, B } = ctx(), b = B;
  const cats = X.cS.filter(c => c.valor > 0);
  // mapa de calor categoria x mês (faturamento)
  const u = S.uni < 0 ? TODAS_U : [S.uni], porMes = D.meses.map((_, k) => A([k], u).cS);
  const mxC = Math.max(...porMes.flatMap(l => l.map(c => c.valor)), 1);
  const cor = v => { const t = v / mxC, a = [253, 242, 246], z = [131, 24, 67]; return { bg: `rgb(${a.map((x, i) => Math.round(x + (z[i] - x) * Math.sqrt(t))).join(",")})`, fg: t > .3 ? "#fff" : "var(--ink)" }; };
  const hm = `<div class="rolar"><table class="hm"><tr><th class="r">Categoria</th>${D.meses.map((_, k) => `<th style="${P.m.includes(k) ? "color:var(--brand-ink)" : ""}">${curtoMes(k)}</th>`).join("")}</tr>
    ${D.catServicos.map((c, i) => `<tr><th class="r" data-tipo="s" data-cat="${esc(c)}">${esc(c)}</th>${porMes.map((l, k) => { const v = l[i].valor, k2 = cor(v); return `<td style="background:${v ? k2.bg : "#f6f3f0"};color:${v ? k2.fg : "var(--muted)"}" data-tt="${tt(esc(c) + " · " + nomeMes(k), [["Faturamento", brl0(v)], ["Serviços", fmt(l[i].qtd)]])}">${v ? brlC(v).replace("R$ ", "") : "—"}</td>`; }).join("")}</tr>`).join("")}</table></div>`;
  return `${cab("Serviços", "O que o salão vende de serviço, por categoria e por item")}
    <div class="kpis">
      ${kpi("Faturamento de serviços", brlC(X.servTot), "no período", "var(--serv)", delta(X.servTot, b && b.servTot), "hero")}
      ${kpi("Serviços realizados", fmt(X.servQtd), "", "#57534e", delta(X.servQtd, b && b.servQtd))}
      ${kpi("Preço médio", brl(div(X.servTot, X.servQtd) || 0), "por serviço", "#7c3aed", delta(div(X.servTot, X.servQtd), b && div(b.servTot, b.servQtd)))}
      ${kpi("Categorias ativas", fmt(cats.length), `${fmt(X.S.filter(x => x.qtd).length)} serviços diferentes`, "var(--gold)")}
      ${kpi("Clientes atendidas", fmt(soma(X.S.map(x => x.cli))), "somando as categorias", "#d4789e")}
      ${kpi("Maior ticket", (() => { const c = [...cats].sort((a, z) => z.valor / z.qtd - a.valor / a.qtd)[0]; return c ? brl(c.valor / c.qtd) : "—"; })(), (() => { const c = [...cats].sort((a, z) => z.valor / z.qtd - a.valor / a.qtd)[0]; return c ? esc(c.cat) : ""; })(), "var(--good)")}
    </div>
    ${card("Categorias de serviço", "Passe o mouse para ver os detalhes e os serviços mais vendidos de cada categoria", galeria("s", X.cS, X.servTot, B))}
    <div class="row c2e">
      ${card("Faturamento e ticket por categoria", "Com foto: passe o mouse para o detalhe", barrasCat("s", X.cS, "var(--serv)"))}
      ${card("Top 12 serviços", "Os itens que mais faturaram no período", barrasItens(X.S, "var(--serv)", 12, "s"))}
    </div>
    ${card("Categoria × mês", "Faturamento de cada categoria em cada mês · quanto mais escuro, maior", hm)}`;
}

function telaProdutos() {
  const { P, X, B } = ctx(), t = X.t;
  const ticketProd = div(X.prodTot, X.prodQtd) || 0, meta = .1, potencial = Math.max(0, t.atend * meta - t.nprod) * ticketProd;
  const vend = X.P.filter(x => x.atend >= 10 && x.nserv > 0).sort((a, b) => (b.prodAt || 0) - (a.prodAt || 0)).slice(0, 15);
  const mxPA = Math.max(...vend.map(x => x.prodAt || 0), meta) * 1.05;
  const conv = `<div class="hb">${vend.map(x => `<div class="hb-r" data-tt="${tt(esc(x.nome), [["Produtos vendidos", fmt(x.nprod)], ["Atendimentos", fmt(x.atend)], ["A cada 100 atend.", fmt1(x.prodAt * 100)], ["Faturamento produtos", brl0(x.prodR)]])}"><div class="hb-l"><span>${esc(x.nome)}</span></div><div class="hb-t" style="position:relative"><i style="--w:${(x.prodAt || 0) / mxPA};--c:${(x.prodAt || 0) >= meta ? "var(--good)" : "var(--prod)"}"></i><span style="position:absolute;top:-3px;bottom:-3px;left:${meta / mxPA * 100}%;border-left:2px dashed var(--bad)"></span></div><div class="hb-v">${fmt1(x.prodAt * 100)}<small>por 100 atendimentos</small></div></div>`).join("")}</div>`;
  return `${cab("Produtos", "Venda de produtos para casa: o que sai, quem vende e quanto o salão deixa de ganhar")}
    <div class="kpis">
      ${kpi("Faturamento de produtos", brlC(X.prodTot), `<b>${pct(t.pctProd)}</b> do faturamento total`, "", delta(X.prodTot, B && B.prodTot), "hero")}
      ${kpi("Unidades vendidas", fmt(X.prodQtd), "", "var(--prod)", delta(X.prodQtd, B && B.prodQtd))}
      ${kpi("Preço médio", brl(ticketProd), "por unidade", "#7c3aed")}
      ${kpi("Produtos / 100 atend.", fmt1(t.prod100 || 0), `meta sugerida: ${fmt(meta * 100)}`, "var(--brand)", delta(t.prod100, B && B.t.prod100))}
      ${kpi("Itens diferentes", fmt(X.R.filter(x => x.qtd).length), `de ${D.produtos.length} no catálogo`, "#57534e")}
      ${kpi("Potencial no período", brlC(potencial), `se a meta de ${fmt(meta * 100)}/100 fosse atingida`, "var(--good)")}
    </div>
    <div class="row c2">
      ${card("Categorias de produto", "Passe o mouse para ver preço médio e os itens mais vendidos", galeria("r", X.cR, X.prodTot, B))}
      ${card("A oportunidade", "", `<div class="met"><div class="big">${brlC(potencial)}</div><p style="margin:6px 0 10px">a mais no período se a equipe vendesse <b>${fmt(meta * 100)} produtos a cada 100 atendimentos</b>, no preço médio atual de ${brl(ticketProd)}.</p>
        Hoje são <b>${fmt1(t.prod100 || 0)}</b> a cada 100. A cliente que faz tratamento no salão é a que mais compra para manter o resultado em casa: indicar o produto usado no atendimento é a venda mais natural.</div>
        <p class="nota">A meta de ${fmt(meta * 100)}/100 é uma sugestão para o exemplo e pode ser ajustada no painel.</p>`)}
    </div>
    <div class="row c2e">
      ${card("Top 12 produtos", "Os itens que mais faturaram", barrasItens(X.R, "var(--prod)", 12, "r"))}
      ${card("Conversão por profissional", "Top 15 · produtos vendidos a cada 100 atendimentos · linha vermelha = meta sugerida (profissionais técnicas com 10+ atendimentos)", conv)}
    </div>`;
}

function telaDados() {
  const { X } = ctx();
  const tab = (cab, linhas) => `<div class="tbl alta"><table><thead><tr>${cab.map((c, i) => `<th class="${i < 2 ? "l" : ""}">${c}</th>`).join("")}</tr></thead><tbody>${linhas.map(l => `<tr>${l.map((v, i) => `<td class="${i < 2 ? "l" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const s = X.S.filter(x => x.qtd).sort((a, b) => b.valor - a.valor), r = X.R.filter(x => x.qtd).sort((a, b) => b.valor - a.valor);
  return `${cab("Dados", "As tabelas que alimentam o painel, já com as categorias padronizadas")}
    <div class="row c2e">
      ${card("Serviços", `${s.length} itens`, tab(["Serviço", "Categoria", "Qtd", "Faturamento", "Preço médio"], s.map(x => [esc(x.nome), esc(x.cat), fmt(x.qtd), brl(x.valor), brl(x.valor / x.qtd)])), `<button class="btn" data-csv="s">Exportar CSV</button>`)}
      ${card("Produtos", `${r.length} itens`, tab(["Produto", "Categoria", "Unid.", "Faturamento", "Preço médio"], r.map(x => [esc(x.nome), esc(x.cat), fmt(x.qtd), brl(x.valor), brl(x.valor / x.qtd)])), `<button class="btn" data-csv="r">Exportar CSV</button>`)}
    </div>`;
}
function exportar(tipo) {
  const { X, P } = ctx(), n = v => String(v).replace(".", ",");
  const l = tipo === "s" ? [["Serviço", "Categoria", "Quantidade", "Faturamento"], ...X.S.filter(x => x.qtd).map(x => [x.nome, x.cat, x.qtd, x.valor.toFixed(2)])]
    : [["Produto", "Categoria", "Unidades", "Faturamento"], ...X.R.filter(x => x.qtd).map(x => [x.nome, x.cat, x.qtd, x.valor.toFixed(2)])];
  const csv = "﻿" + l.map(r => r.map(v => `"${n(v)}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `${tipo === "s" ? "Servicos" : "Produtos"} - ${P.nome}.csv`; a.click();
}

/* ---------------- render ---------------- */
const TABS = [["geral", "Visão Geral", '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>'], ["pros", "Profissionais", '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'],
  ["servicos", "Serviços", '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'], ["produtos", "Produtos", '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>'],
  ["dados", "Dados", '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>']];
const TELAS = { geral: telaGeral, pros: telaPros, servicos: telaServicos, produtos: telaProdutos, dados: telaDados };
function render(manter) {
  const y = scrollY; DESENHOS.length = 0; tip.hidden = true;
  $("#app").innerHTML = TELAS[S.tab]();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  document.querySelectorAll("#unis button").forEach(b => b.classList.toggle("on", +b.dataset.u === S.uni));
  DESENHOS.forEach(f => f());
  if (manter) scrollTo(0, y);
}
$("#tabs").innerHTML = TABS.map(([k, n, ic]) => `<button class="tab" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}</button>`).join("");
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) { S.tab = t.dataset.tab; render(); scrollTo({ top: 0 }); } });
$("#per").innerHTML = PER.map((p, i) => `<option value="${i}">${esc(p.nome)}</option>`).join(""); $("#per").value = S.per;
$("#per").addEventListener("change", e => { S.per = +e.target.value; render(true); });
$("#unis").innerHTML = [`<button data-u="-1">Todas</button>`, ...D.unidades.map((u, i) => `<button data-u="${i}">${esc(u.replace(/^Unidade /i, ""))}</button>`)].join("");
$("#unis").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.uni = +b.dataset.u; render(true); } });
$("#app").addEventListener("click", e => {
  const o = e.target.closest("[data-ordem]"); if (o) { S.ordem = o.dataset.ordem; return render(true); }
  const c = e.target.closest("[data-csv]"); if (c) exportar(c.dataset.csv);
});
if (TELAS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
$("#logo").innerHTML = LOGO ? `<img src="${LOGO}" alt="Lucas Rodrigues · Analista de Dados & BI">` : "<b>Lucas Rodrigues</b>";
$("#gerado").textContent = `${NM} meses · ${NU} unidades · ${D.pros.length} profissionais · gerado em ${D.gerado}`;
render();
</script>
</body>
</html>

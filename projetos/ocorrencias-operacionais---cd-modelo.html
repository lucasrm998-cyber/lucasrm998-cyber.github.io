<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocorrências Operacionais · Demo · Lucas Rodrigues</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f5f3;
  --surface: #ffffff;
  --surface-2: #fafaf8;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #ebeae4;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, .08);
  --brand: #0f766e;
  --brand-2: #10b981;
  --brand-ink: #0f5e57;
  --brand-soft: #e7f6f2;
  --good: #0ca30c; --good-ink: #067a06; --good-soft: #e8f6e8;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fff5dc;
  --bad: #d03b3b; --bad-ink: #b42323; --bad-soft: #fbeaea;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -18px rgba(16, 24, 40, .2);
  --radius: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }

/* ---------- topo laranja ---------- */
.top { position: relative; overflow: hidden; background: linear-gradient(120deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; }
.top::before, .top::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .08); pointer-events: none; }
.top::before { width: 520px; height: 520px; right: -140px; top: -300px; }
.top::after { width: 260px; height: 260px; left: 38%; bottom: -200px; }
.top-in { position: relative; max-width: 1440px; margin: 0 auto; padding: 22px 24px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand img { height: 46px; width: auto; display: block; }
.wordmark { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
.wordmark i { font-style: italic; font-weight: 900; letter-spacing: -.02em; }
.brand-t { border-left: 1px solid rgba(255, 255, 255, .35); padding-left: 16px; }
.brand-t b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.brand-t small { display: block; font-size: 12.5px; opacity: .9; }
.live { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; font-weight: 600; background: rgba(255, 255, 255, .18); padding: 2px 9px; border-radius: 999px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

.periodo { margin-left: auto; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 0 14px 30px -16px rgba(6, 60, 50, .45); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.periodo > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; background: #f1f0ec; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.datas { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.datas input { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; background: var(--surface-2); font-size: 12.5px; }

/* ---------- abas ---------- */
.tabs-bar { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.tabs { max-width: 1440px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: transparent; padding: 14px 16px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: color .2s, border-color .2s; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--brand-ink); border-bottom-color: var(--brand); }
.tab svg { width: 16px; height: 16px; }
.stamp { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 16px; }
.stamp b { color: var(--ink-2); }

main { max-width: 1440px; margin: 0 auto; padding: 22px 24px 8px; display: flex; flex-direction: column; gap: 18px; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.sec-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); }
.badge.bad { background: var(--bad-soft); color: var(--bad-ink); }
.badge.good { background: var(--good-soft); color: var(--good-ink); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { position: relative; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; border-top: 3px solid var(--c, var(--brand)); min-height: 136px; }
.kpi-l { font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.kpi-v { font-size: 28px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
.kpi-s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--muted); }
.kpi-s b { color: var(--ink-2); font-weight: 650; }
.kpi .spark { margin-top: auto; height: 30px; width: 100%; display: block; }
.kpi.hero { grid-column: span 2; border-top-color: var(--brand); background: linear-gradient(135deg, #fff 55%, var(--brand-soft)); }
.kpi.hero .kpi-v { font-size: 44px; }
.hero-g { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: end; height: 100%; }
.hero-side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; text-align: right; font-size: 12px; color: var(--ink-2); }
.hero-side b { font-size: 15px; color: var(--ink); }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 999px; font-weight: 700; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { background: var(--bad-soft); color: var(--bad-ink); }
.delta.down { background: var(--good-soft); color: var(--good-ink); }
.delta.eq { background: #f1f0ec; color: var(--ink-2); }
.farol { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.farol i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.farol.ok { background: var(--good-soft); color: var(--good-ink); }
.farol.aten { background: var(--warn-soft); color: var(--warn-ink); }
.farol.aten i { background: var(--warn); }
.farol.crit { background: var(--bad-soft); color: var(--bad-ink); }

/* ---------- insights ---------- */
.ins-wrap { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: stretch; }
.ins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.in { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 13px 14px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px; align-content: start; animation: subir .5s both; }
.in .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 800; }
.in.bad .ic { background: var(--bad-soft); color: var(--bad-ink); }
.in.good .ic { background: var(--good-soft); color: var(--good-ink); }
.in.info .ic { background: var(--brand-soft); color: var(--brand-ink); }
.in b { font-size: 13.5px; line-height: 1.3; }
.in p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.mascote { width: 170px; display: flex; align-items: flex-end; justify-content: center; }
.mascote img { width: 100%; height: auto; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .15)); }
@keyframes subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- cartões ---------- */
.row { display: grid; gap: 18px; }
.row.c2 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.row.c2e { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; display: flex; flex-direction: column; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.card-h p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend i.ln { height: 3px; border-radius: 2px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--c); background: none; border-radius: 0; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.foco { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }

svg text { font-family: var(--font); }
.ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.ref-t { font-size: 10.5px; font-weight: 700; }
.lbl { font-size: 11px; font-weight: 700; fill: var(--ink); }

/* ---------- Pareto ---------- */
.par { display: flex; flex-direction: column; }
.par-r { display: grid; grid-template-columns: 22px minmax(90px, 150px) 1fr 52px 54px; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 8px; cursor: pointer; font-size: 12.5px; transition: background .15s; }
.par-r:hover { background: var(--surface-2); }
.par-r.sel { background: var(--brand-soft); }
.par-r.dim { opacity: .45; }
.par-h { cursor: default; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 0; }
.par-h:hover { background: none; }
.par-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.par-l { display: flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.par-l i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.par-t { position: relative; height: 18px; display: flex; align-items: center; }
.par-b { flex: none; height: 12px; border-radius: 0 4px 4px 0; background: var(--brand); min-width: 2px; width: calc(var(--w) * (100% - 52px)); transform-origin: left; animation: crescer .7s cubic-bezier(.2, .8, .2, 1) both; }
.par-t span { margin-left: 8px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.par-p, .par-c { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.par-c { color: var(--muted); }
.par-80 { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--brand-ink); margin: 2px 6px; }
.par-80::before, .par-80::after { content: ""; flex: 1; border-top: 1px dashed var(--brand); }
@keyframes crescer { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- calendário ---------- */
.cal-wrap { display: flex; flex-wrap: wrap; gap: 18px 26px; }
.cal { flex: 1 1 250px; max-width: 400px; }
.cal h3 { margin: 0 0 6px; font-size: 13px; text-transform: capitalize; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-g .wd { font-size: 10.5px; color: var(--muted); text-align: center; font-weight: 700; }
.cd { aspect-ratio: 1 / .82; border-radius: 7px; display: flex; flex-direction: column; justify-content: space-between; padding: 3px 5px; font-size: 10px; color: var(--ink-2); background: #f3f2ee; cursor: default; transition: transform .12s, box-shadow .12s; }
.cd b { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.cd.ok { background: var(--good-soft); box-shadow: inset 0 -3px 0 var(--good); }
.cd.aten { background: var(--warn-soft); box-shadow: inset 0 -3px 0 var(--warn); }
.cd.crit { background: var(--bad-soft); box-shadow: inset 0 -3px 0 var(--bad); }
.cd.crit b { color: var(--bad-ink); }
.cd.fora { opacity: .35; }
.cd.vazio { background: transparent; box-shadow: none; }
.cd:not(.vazio):hover { transform: scale(1.08); position: relative; z-index: 1; }

/* ---------- small multiples / heatmap / composição ---------- */
.sm { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.sm-c { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 2px; }
.sm-c .t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.sm-c .t i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.sm-c .v { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sm-c .v b { font-size: 20px; letter-spacing: -.02em; }
.sm-c .v small { font-size: 11px; color: var(--muted); }
.hm { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.hm th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px; }
.hm th.r { text-align: left; color: var(--ink-2); white-space: nowrap; }
.hm td { text-align: center; border-radius: 6px; padding: 7px 4px; font-weight: 650; font-variant-numeric: tabular-nums; cursor: default; }
.mix { display: flex; flex-direction: column; gap: 10px; }
.mix-r { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
.mix-r > span { font-weight: 700; text-transform: capitalize; }
.mix-b { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface); }
.mix-b div { background: var(--c); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; min-width: 0; overflow: hidden; white-space: nowrap; }

/* ---------- alertas ---------- */
.alerta { border-radius: var(--radius); padding: 14px 18px; background: linear-gradient(90deg, var(--bad-soft), #fff 70%); border: 1px solid rgba(208, 59, 59, .25); border-left: 5px solid var(--bad); display: flex; flex-direction: column; gap: 6px; }
.alerta h3 { margin: 0; font-size: 14.5px; color: var(--bad-ink); }
.alerta ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.alerta.ok { background: linear-gradient(90deg, var(--good-soft), #fff 70%); border-color: rgba(12, 163, 12, .25); border-left-color: var(--good); }
.alerta.ok h3 { color: var(--good-ink); }

/* ---------- tabela de auditoria ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-2)); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.tbl { overflow: auto; max-height: 620px; border-radius: 10px; border: 1px solid var(--grid); }
.tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { position: sticky; top: 0; z-index: 1; background: #ecf7f4; text-align: right; font-weight: 700; color: var(--ink-2); padding: 9px 10px; border-bottom: 2px solid var(--brand); white-space: nowrap; cursor: pointer; user-select: none; font-size: 11.5px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; position: sticky; left: 0; background: inherit; }
.tbl th.sorted { color: var(--brand-ink); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.tbl tbody tr { background: var(--surface); }
.tbl tbody tr:hover { background: #f5fbf9; }
.tbl td.anom { font-weight: 800; color: var(--bad-ink); }
.tbl td.anom::after { content: " ⚑"; font-size: 10px; }
.tbl td.tot { font-weight: 800; }
.tbl tfoot td { position: sticky; bottom: 0; background: #ecf7f4; font-weight: 800; border-top: 2px solid var(--brand); }

#tip { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; background: rgba(255, 255, 255, .97); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 34px -10px rgba(16, 24, 40, .3); padding: 10px 12px; min-width: 200px; font-size: 12.5px; }
.tt-h { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tt-r { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; color: var(--ink-2); padding: 1px 0; }
.tt-r i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.tt-r b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tt-f { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.vazio-msg { display: grid; place-items: center; min-height: 140px; color: var(--muted); }

footer { max-width: 1440px; margin: 0 auto; padding: 10px 24px 28px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi.hero { grid-column: span 3; }
  .sm { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.c2, .row.c2e { grid-template-columns: minmax(0, 1fr); }
  .mascote { display: none; }
  .ins-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .ins { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi.hero { grid-column: span 2; }
  .sm { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .periodo { margin-left: 0; width: 100%; }
  .stamp { display: none; }
}
@media (max-width: 520px) {
  .top-in, main, .tabs, footer { padding-left: 16px; padding-right: 16px; }
  .wordmark { font-size: 24px; }
  .brand-t { border: 0; padding: 0; }
  .brand { flex-wrap: wrap; }
  .kpis { gap: 10px; }
  .kpi { padding: 12px 12px 10px; min-height: 0; }
  .kpi-l { font-size: 10.5px; }
  .kpi-v { font-size: 22px; }
  .kpi.hero .kpi-v { font-size: 36px; }
  .hero-g { grid-template-columns: 1fr; }
  .hero-side { align-items: flex-start; text-align: left; }
  .sm { grid-template-columns: minmax(0, 1fr); }
  .par-r { grid-template-columns: 18px minmax(80px, 110px) 1fr 44px; }
  .par-c { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .tabs-bar, .periodo { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div id="logo"></div>
      <div class="brand-t">
        <b id="titulo">Ocorrências</b>
        <small>Inventário · Centro de Distribuição · dados fictícios</small>
        <span class="live"><i></i><span id="ultimo"></span></span>
      </div>
    </div>
    <div class="periodo">
      <span>Período</span>
      <div class="seg" id="presets"></div>
      <div class="datas"><input type="date" id="de" aria-label="Data inicial"> até <input type="date" id="ate" aria-label="Data final"></div>
    </div>
  </div>
</header>
<div class="tabs-bar"><nav class="tabs" id="tabs"></nav></div>
<main id="app"></main>
<footer><span>Dados fictícios · Lucas Rodrigues · Analista de Dados &amp; BI</span><span id="gerado"></span></footer>

const MASCOTE = null;

/* ================= base ================= */
const N = D.dias.length, K = D.cats.length;
const LIM = D.limites;
const FAM_COR = { sobras: "#2a78d6", avarias: "#eb6834", retidos: "#1baf7a", expedicao: "#eda100", risco: "#e87ba4" };
const ST_COR = { ok: "#0ca30c", aten: "#fab219", crit: "#d03b3b" };
const ST_NOME = { ok: "Normal", aten: "Atenção", crit: "Crítico" };
const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const DOW_LONGO = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const CAT = Object.fromEntries(D.cats.map((c, i) => [c.k, i]));
const corCat = i => FAM_COR[D.cats[i].fam];

const datas = D.dias.map(s => new Date(s + "T00:00:00"));
const tot = D.v.map(r => r.reduce((a, b) => a + b, 0));
const status = t => t > LIM.critico ? "crit" : t > LIM.atencao ? "aten" : "ok";
const ddmm = i => D.dias[i].slice(8, 10) + "/" + D.dias[i].slice(5, 7);
const mesAno = i => datas[i].getFullYear() * 12 + datas[i].getMonth();

const fmt = v => Math.round(v).toLocaleString("pt-BR");
const fmt1 = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt2 = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v, d = 1) => (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, k) => a + k);

// Pico anômalo: dia com ≥ 3× a média dos 30 dias anteriores da mesma ocorrência
// (no começo da planilha, com menos de 7 dias de histórico, usa a média geral).
// Média e não mediana: há ocorrências com muitos dias zerados e picos isolados.
const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
const MEDIA_GERAL = D.cats.map((_, k) => media(D.v.map(r => r[k])));
const MED30 = D.v.map((_, i) => D.cats.map((_, k) =>
  i < 7 ? MEDIA_GERAL[k] : media(D.v.slice(Math.max(0, i - 30), i).map(r => r[k]))));
const medBase = (i, k) => Math.max(MED30[i][k], 1);
const anomalo = (i, k) => D.v[i][k] >= 30 && D.v[i][k] >= 3 * medBase(i, k);

// Média móvel de 7 dias do total (sobre todo o histórico)
const MM7 = tot.map((_, i) => i < 6 ? null : tot.slice(i - 6, i + 1).reduce((a, b) => a + b, 0) / 7);

/* ================= estado ================= */
const S = { a: 0, b: N - 1, preset: "mes", tab: "torre", foco: null, modo: "fam", filtro: "todos", ordem: { col: "data", dir: -1 } };

const PRESETS = [
  ["mes", "Mês atual"], ["d7", "7 dias"], ["d30", "30 dias"], ["ant", "Mês anterior"], ["tudo", "Tudo"],
];
function aplicaPreset(p) {
  const ult = N - 1, m = mesAno(ult);
  if (p === "mes") { S.a = D.dias.findIndex((_, i) => mesAno(i) === m); S.b = ult; }
  if (p === "d7") { S.a = Math.max(0, N - 7); S.b = ult; }
  if (p === "d30") { S.a = Math.max(0, N - 30); S.b = ult; }
  if (p === "ant") {
    const idx = range(0, ult).filter(i => mesAno(i) === m - 1);
    if (idx.length) { S.a = idx[0]; S.b = idx[idx.length - 1]; } else { S.a = 0; S.b = ult; }
  }
  if (p === "tudo") { S.a = 0; S.b = ult; }
  S.preset = p;
}

function soma(a, b) {
  const s = new Array(K).fill(0);
  for (let i = a; i <= b; i++) for (let k = 0; k < K; k++) s[k] += D.v[i][k];
  return s;
}
// Comparação igual ao relatório anterior: mesma quantidade de dias imediatamente antes
function anterior(a, b) {
  const n = b - a + 1;
  return a - n < 0 ? null : { a: a - n, b: a - 1 };
}
function ctx() {
  const { a, b } = S, n = b - a + 1;
  const cur = soma(a, b), p = anterior(a, b);
  const prev = p ? soma(p.a, p.b) : null;
  return {
    a, b, n, idx: range(a, b), cur, prev, p,
    total: cur.reduce((x, y) => x + y, 0),
    totalPrev: prev ? prev.reduce((x, y) => x + y, 0) : null,
    pLabel: p ? `${ddmm(p.a)} a ${ddmm(p.b)}` : "",
  };
}

/* ================= tooltip ================= */
const tip = document.getElementById("tip");
function mostraTip(html, ev) { tip.innerHTML = html; tip.hidden = false; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.transform = `translate(${Math.max(8, x)}px, ${Math.max(8, y)}px)`;
}
function escondeTip() { tip.hidden = true; }
function tipLinhas(linhas) {
  return linhas.map(([nome, v, cor]) => `<div class="tt-r"><i style="--c:${cor || "transparent"}"></i><span>${esc(nome)}</span><b>${v}</b></div>`).join("");
}
function tipDia(i, extra = "") {
  const fams = D.familias.map(f => [f.nome, fmt(D.cats.reduce((s, c, k) => s + (c.fam === f.k ? D.v[i][k] : 0), 0)), FAM_COR[f.k]]);
  const st = status(tot[i]);
  return `<div class="tt-h"><span>${ddmm(i)}/${D.dias[i].slice(0, 4)} · ${DOW[datas[i].getDay()]}</span><span class="farol ${st}"><i></i>${ST_NOME[st]}</span></div>`
    + tipLinhas(fams) + extra + `<div class="tt-f"><span>Total do dia</span><span>${fmt(tot[i])}</span></div>`;
}

/* ================= peças ================= */
function delta(cur, prev) {
  if (prev == null) return `<span class="delta eq">sem base</span>`;
  if (prev === 0) return cur === 0 ? `<span class="delta eq">0,0%</span>` : `<span class="delta up">▲ novo</span>`;
  const d = (cur - prev) / prev;
  if (Math.abs(d) < .0005) return `<span class="delta eq">0,0%</span>`;
  return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${pct(Math.abs(d))}</span>`;
}
function sparkline(vals, cor) {
  if (vals.length < 2) return "";
  const w = 200, h = 30, mx = Math.max(...vals, 1);
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 2 - v / mx * (h - 4)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}L${w},${h}L0,${h}Z" fill="${cor}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${cor}"/></svg>`;
}
function contaAte(root) {
  root.querySelectorAll("[data-n]").forEach(el => {
    const alvo = +el.dataset.n, dec = +(el.dataset.dec || 0), suf = el.dataset.suf || "";
    const f = v => (dec ? v.toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : fmt(v)) + suf;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = f(alvo); return; }
    const t0 = performance.now(), dur = 900;
    const passo = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = f(alvo * e);
      if (p < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}
function kpi(c, k, cor, rotulo) {
  const v = c.cur[k], media = v / c.n;
  return `<div class="kpi" style="--c:${cor}">
    <div class="kpi-l">${esc(rotulo || D.cats[k].nome)}</div>
    <div class="kpi-v" data-n="${v}">0</div>
    <div class="kpi-s">${delta(v, c.prev && c.prev[k])}<span>Média/dia <b>${fmt2(media)}</b></span></div>
    ${sparkline(c.idx.map(i => D.v[i][k]), cor)}
  </div>`;
}
function cardHtml(id, titulo, sub, extra = "") {
  return `<section class="card"><div class="card-h"><div><h2>${titulo}</h2><p>${sub}</p></div>${extra}</div><div id="${id}"></div></section>`;
}
function legenda(itens) {
  return `<div class="legend">${itens.map(([n, c, tipo]) => `<span><i class="${tipo || ""}" style="--c:${c}"></i>${esc(n)}</span>`).join("")}</div>`;
}

/* ================= gráficos SVG ================= */
function passoBonito(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x || 1))), m = x / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function escala(mx, ticks = 4) {
  const passo = passoBonito(Math.max(mx, 1) / ticks);
  return { passo, topo: Math.ceil(Math.max(mx, 1) / passo) * passo };
}
const curto = v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : fmt(v);
function colTopo(x, y0, y1, w, r) {
  r = Math.min(r, w / 2, Math.abs(y0 - y1));
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
}
function eixos(W, H, m, esc, iw, nTicks) {
  let g = "";
  for (let v = 0; v <= esc.topo + 1e-9; v += esc.passo) {
    const y = m.t + (1 - v / esc.topo) * (H - m.t - m.b);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${v ? "#ebeae4" : "#c3c2b7"}" stroke-width="1"/>`;
    g += `<text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${curto(v)}</text>`;
  }
  return g;
}
function rotulosX(idx, x, H, m, iw) {
  const cada = Math.max(1, Math.ceil(idx.length / Math.max(1, iw / 52)));
  return idx.map((i, j) => j % cada ? "" : `<text class="ax" x="${x(j)}" y="${H - m.b + 16}" text-anchor="middle">${ddmm(i)}</text>`).join("");
}

// Colunas empilhadas por dia
function colunasDia(el, idx, series, { refs = [], linha = null, alto = 300 } = {}) {
  const W = Math.max(280, el.clientWidth), H = alto, m = { l: 46, r: refs.length ? 64 : 12, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = idx.length;
  const somas = idx.map((_, j) => series.reduce((s, se) => s + se.vals[j], 0));
  const mx = Math.max(...somas, ...(linha ? linha.vals.filter(v => v != null) : [0]), ...refs.map(r => r.v * 1.08));
  const es = escala(mx), y = v => m.t + (1 - v / es.topo) * ih;
  const band = iw / n, bw = Math.max(1, band * (n > 60 ? .78 : .66)), x = j => m.l + band * j + band / 2;
  let g = eixos(W, H, m, es, iw);
  idx.forEach((i, j) => {
    let acc = 0;
    const visiveis = series.map((se, s) => [s, se.vals[j]]).filter(([, v]) => v > 0);
    visiveis.forEach(([s, v], q) => {
      const y0 = y(acc), y1 = y(acc + v), x0 = x(j) - bw / 2;
      acc += v;
      const fill = series[s].cor;
      g += q === visiveis.length - 1
        ? `<path d="${colTopo(x0, y0, y1, bw, 3)}" fill="${fill}" stroke="#fff" stroke-width="${bw > 4 ? 1 : 0}"/>`
        : `<rect x="${x0}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="${fill}" stroke="#fff" stroke-width="${bw > 4 ? 1 : 0}"/>`;
    });
  });
  let yUlt = -Infinity;  // afasta os rótulos quando as linhas ficam muito próximas
  [...refs].sort((p, q) => q.v - p.v).forEach(r => {
    const yl = Math.max(y(r.v) + 4, yUlt + 13); yUlt = yl;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.cor}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    g += `<text class="ref-t" x="${W - m.r + 6}" y="${yl}" fill="${r.ink}">${r.nome} ${fmt(r.v)}</text>`;
  });
  if (linha) {
    const d = linha.vals.map((v, j) => v == null ? "" : `${linha.vals[j - 1] == null ? "M" : "L"}${x(j).toFixed(1)},${y(v).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="1 0" opacity=".75" stroke-linejoin="round"/>`;
  }
  g += rotulosX(idx, x, H, m, iw);
  g += `<rect class="hov" x="0" y="${m.t}" width="${band}" height="${ih}" fill="#0b0b0b" opacity="0" rx="4"/>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Ocorrências por dia">${g}</svg></div>`;
  const svg = el.querySelector("svg"), hov = svg.querySelector(".hov");
  svg.querySelector(".hit").addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const j = Math.min(n - 1, Math.max(0, Math.floor((px - m.l) / band)));
    hov.setAttribute("x", m.l + band * j); hov.setAttribute("opacity", ".06");
    const i = idx[j];
    const extra = series.length === 1 ? tipLinhas([[series[0].nome, fmt(series[0].vals[j]), series[0].cor]]) : "";
    mostraTip(series.length === 1
      ? `<div class="tt-h"><span>${ddmm(i)} · ${DOW[datas[i].getDay()]}</span></div>${extra}<div class="tt-f"><span>Total do dia</span><span>${fmt(tot[i])}</span></div>`
      : tipDia(i, linha && linha.vals[j] != null ? `<div class="tt-r"><i style="--c:#0b0b0b"></i><span>Média móvel 7d</span><b>${fmt(linha.vals[j])}</b></div>` : ""), ev);
  });
  svg.querySelector(".hit").addEventListener("mouseleave", () => { hov.setAttribute("opacity", "0"); escondeTip(); });
}

// Linhas com crosshair
function linhasDia(el, idx, series, { alto = 280 } = {}) {
  const W = Math.max(280, el.clientWidth), H = alto, m = { l: 46, r: 14, t: 14, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = idx.length;
  const es = escala(Math.max(...series.flatMap(s => s.vals)));
  const y = v => m.t + (1 - v / es.topo) * ih, x = j => m.l + (n === 1 ? iw / 2 : iw * j / (n - 1));
  let g = eixos(W, H, m, es, iw);
  series.forEach(s => {
    const d = s.vals.map((v, j) => (j ? "L" : "M") + x(j).toFixed(1) + "," + y(v).toFixed(1)).join("");
    if (s.area) g += `<path d="${d}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.cor}" opacity=".1"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round"/>`;
    const jm = s.vals.indexOf(Math.max(...s.vals));
    if (s.vals[jm] > 0) g += `<circle cx="${x(jm)}" cy="${y(s.vals[jm])}" r="4.5" fill="${s.cor}" stroke="#fff" stroke-width="2"/><text class="lbl" x="${Math.min(W - m.r - 20, Math.max(m.l + 20, x(jm)))}" y="${y(s.vals[jm]) - 10}" text-anchor="middle">${fmt(s.vals[jm])}</text>`;
  });
  g += rotulosX(idx, x, H, m, iw);
  g += `<g class="cross" opacity="0"><line y1="${m.t}" y2="${m.t + ih}" stroke="#898781" stroke-width="1"/>${series.map(s => `<circle r="5" fill="${s.cor}" stroke="#fff" stroke-width="2"/>`).join("")}</g>`;
  g += `<rect class="hit" x="${m.l - 6}" y="${m.t}" width="${iw + 12}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}</svg></div>`;
  const svg = el.querySelector("svg"), cross = svg.querySelector(".cross"), hit = svg.querySelector(".hit");
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const j = Math.min(n - 1, Math.max(0, Math.round((px - m.l) / (iw / Math.max(1, n - 1)))));
    cross.setAttribute("opacity", "1");
    cross.querySelector("line").setAttribute("x1", x(j)); cross.querySelector("line").setAttribute("x2", x(j));
    cross.querySelectorAll("circle").forEach((c, s) => { c.setAttribute("cx", x(j)); c.setAttribute("cy", y(series[s].vals[j])); });
    const i = idx[j];
    mostraTip(`<div class="tt-h"><span>${ddmm(i)} · ${DOW[datas[i].getDay()]}</span></div>` + tipLinhas(series.map(s => [s.nome, fmt(s.vals[j]), s.cor])), ev);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", "0"); escondeTip(); });
}

// Colunas agrupadas por mês
function colunasMes(el, meses, series, { alto = 260 } = {}) {
  const W = Math.max(280, el.clientWidth), H = alto, m = { l: 46, r: 10, t: 22, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = meses.length, ns = series.length;
  const es = escala(Math.max(...series.flatMap(s => s.vals)));
  const y = v => m.t + (1 - v / es.topo) * ih, band = iw / n;
  const gw = Math.min(band * .72, 46 * ns), bw = (gw - (ns - 1) * 2) / ns;
  let g = eixos(W, H, m, es, iw);
  meses.forEach((mm, j) => {
    const x0 = m.l + band * j + (band - gw) / 2;
    series.forEach((s, q) => {
      const v = s.vals[j], xx = x0 + q * (bw + 2);
      if (v > 0) g += `<path d="${colTopo(xx, y(0), y(v), bw, 4)}" fill="${s.cor}"/>`;
      if (bw >= 26) g += `<text class="lbl" x="${xx + bw / 2}" y="${y(v) - 5}" text-anchor="middle">${fmt1(v)}</text>`;
      g += `<rect class="hb" data-j="${j}" data-q="${q}" x="${xx - 1}" y="${m.t}" width="${bw + 2}" height="${ih}" fill="transparent"/>`;
    });
    g += `<text class="ax" x="${m.l + band * j + band / 2}" y="${H - m.b + 16}" text-anchor="middle">${mm.nome}</text>`;
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}</svg></div>`;
  el.querySelectorAll(".hb").forEach(r => {
    r.addEventListener("mousemove", ev => {
      const j = +r.dataset.j;
      mostraTip(`<div class="tt-h"><span style="text-transform:capitalize">${meses[j].longo}</span><span class="ax">média/dia</span></div>` + tipLinhas(series.map(s => [s.nome, fmt2(s.vals[j]), s.cor])), ev);
    });
    r.addEventListener("mouseleave", escondeTip);
  });
}

/* ================= meses (histórico completo) ================= */
function meses() {
  const out = [];
  for (let i = 0; i < N; i++) {
    const m = mesAno(i);
    if (!out.length || out[out.length - 1].m !== m) out.push({ m, a: i, b: i, nome: MES[datas[i].getMonth()].slice(0, 3), longo: `${MES[datas[i].getMonth()]} ${datas[i].getFullYear()}` });
    else out[out.length - 1].b = i;
  }
  out.forEach(o => {
    o.n = o.b - o.a + 1;
    o.soma = soma(o.a, o.b);
    o.dim = new Date(datas[o.a].getFullYear(), datas[o.a].getMonth() + 1, 0).getDate();
    o.parcial = o.n < o.dim;
  });
  return out;
}
const MESES = meses();

/* ================= insights automáticos ================= */
function insights(c) {
  const L = [];
  const media = c.total / c.n;
  // 1. Dia mais crítico
  const iPico = c.idx.reduce((m, i) => tot[i] > tot[m] ? i : m, c.a);
  const kPico = D.v[iPico].indexOf(Math.max(...D.v[iPico]));
  if (c.n > 1 && tot[iPico] > 0) L.push({ tom: "bad", ic: "▲", t: `${ddmm(iPico)} (${DOW[datas[iPico].getDay()]}) foi o dia mais pesado`, p: `${fmt(tot[iPico])} ocorrências, ${fmt1(tot[iPico] / Math.max(media, 1))}× a média do período. Quem puxou: ${D.cats[kPico].nome} (${fmt(D.v[iPico][kPico])}).` });
  // 2 e 3. Maior alta e maior queda vs período anterior
  if (c.prev) {
    const dif = c.cur.map((v, k) => ({ k, d: v - c.prev[k], p: c.prev[k] ? (v - c.prev[k]) / c.prev[k] : null }));
    const alta = dif.filter(x => x.d > 0).sort((x, y) => y.d - x.d)[0];
    const queda = dif.filter(x => x.d < 0).sort((x, y) => x.d - y.d)[0];
    if (alta) L.push({ tom: "bad", ic: "↗", t: `${D.cats[alta.k].nome} subiu ${alta.p == null ? "" : pct(alta.p, 0)}`, p: `+${fmt(alta.d)} ocorrências vs ${c.pLabel} (${fmt(c.prev[alta.k])} → ${fmt(c.cur[alta.k])}). É o maior aumento em volume.` });
    if (queda) L.push({ tom: "good", ic: "↘", t: `${D.cats[queda.k].nome} caiu ${pct(-queda.p, 0)}`, p: `${fmt(queda.d)} ocorrências vs ${c.pLabel} (${fmt(c.prev[queda.k])} → ${fmt(c.cur[queda.k])}). A maior melhora do período.` });
  }
  // 4. Concentração (Pareto 80/20)
  if (c.total > 0) {
    const ord = c.cur.map((v, k) => [k, v]).sort((x, y) => y[1] - x[1]);
    let acc = 0, n80 = 0;
    for (const [, v] of ord) { acc += v; n80++; if (acc / c.total >= .8) break; }
    L.push({ tom: "info", ic: "◎", t: `${n80} de ${K} categorias = ${pct(acc / c.total, 0)} do volume`, p: `${ord.slice(0, n80).map(([k]) => D.cats[k].nome).join(", ")}. Atacar essas resolve a maior parte do problema.` });
  }
  // 5. Farol e sequência acima do limite
  const sts = c.idx.map(i => status(tot[i]));
  const nCrit = sts.filter(s => s === "crit").length, nOk = sts.filter(s => s === "ok").length;
  let seq = 0, best = 0, fimBest = -1;
  c.idx.forEach((i, j) => { seq = sts[j] !== "ok" ? seq + 1 : 0; if (seq > best) { best = seq; fimBest = i; } });
  L.push({ tom: nCrit ? "bad" : "good", ic: nCrit ? "!" : "✓", t: nCrit ? `${nCrit} dia(s) crítico(s) em ${c.n}` : `Nenhum dia crítico em ${c.n} dia(s)`,
    p: best > 1 ? `Maior sequência acima de ${fmt(LIM.atencao)}: ${best} dias seguidos (${ddmm(fimBest - best + 1)} a ${ddmm(fimBest)}). ${nOk} dia(s) dentro do normal.` : `${nOk} de ${c.n} dia(s) dentro do normal (até ${fmt(LIM.atencao)} ocorrências).` });
  // 6. Projeção do mês (quando o período é o mês corrente) ou dia da semana mais pesado
  const mAtual = MESES[MESES.length - 1], mAnt = MESES[MESES.length - 2];
  if (c.a === mAtual.a && c.b === N - 1 && mAtual.parcial) {
    const proj = c.total / c.n * mAtual.dim;
    const totAnt = mAnt ? mAnt.soma.reduce((x, y) => x + y, 0) : null;
    L.push({ tom: totAnt != null && proj < totAnt ? "good" : "bad", ic: "⟶", t: `No ritmo atual, ${MES[datas[c.a].getMonth()]} fecha em ~${fmt(proj)}`,
      p: `${fmt1(c.total / c.n)} por dia × ${mAtual.dim} dias.` + (totAnt != null ? ` ${MES[datas[mAnt.a].getMonth()][0].toUpperCase() + MES[datas[mAnt.a].getMonth()].slice(1)} fechou com ${fmt(totAnt)} (${proj < totAnt ? "▼" : "▲"} ${pct(Math.abs(proj - totAnt) / totAnt, 0)}).` : "") });
  }
  const base = c.n >= 14 ? c.idx : range(0, N - 1);
  const porDow = Array.from({ length: 7 }, () => [0, 0]);
  base.forEach(i => { const d = datas[i].getDay(); porDow[d][0] += tot[i]; porDow[d][1]++; });
  const medDow = porDow.map(([s, q]) => q ? s / q : 0), mediaBase = base.reduce((s, i) => s + tot[i], 0) / base.length;
  const dPior = medDow.indexOf(Math.max(...medDow));
  if (L.length < 6) L.push({ tom: "info", ic: "◷", t: `${DOW_LONGO[dPior]} é o dia mais pesado da semana`, p: `Média de ${fmt(medDow[dPior])} ocorrências, ${pct(medDow[dPior] / mediaBase - 1, 0)} acima da média ${c.n >= 14 ? "do período" : "do histórico"} (${fmt(mediaBase)}). Vale reforçar triagem e equipe nesse dia.` });
  return L.slice(0, 6);
}

/* ================= páginas ================= */
const app = document.getElementById("app");
const desenhos = [];  // funções que redesenham os gráficos (resize)
const desenha = (fn) => { desenhos.push(fn); fn(); };

function cabecalho(titulo, sub, badge) {
  return `<div class="sec-h"><div><h1>${titulo}</h1><p>${sub}</p></div>${badge || ""}</div>`;
}
function textoPeriodo(c) {
  return `${ddmm(c.a)}/${D.dias[c.a].slice(0, 4)} a ${ddmm(c.b)}/${D.dias[c.b].slice(0, 4)} · ${c.n} dia(s)` + (c.p ? ` · comparado com ${c.pLabel}` : "");
}

function paginaTorre(c) {
  const ultSt = status(tot[c.b]);
  const mAtual = MESES[MESES.length - 1];
  const proj = c.a === mAtual.a && c.b === N - 1 && mAtual.parcial ? `<span>Projeção do mês<br><b>~${fmt(c.total / c.n * mAtual.dim)}</b></span>` : "";
  const kpiCats = ["SOBRAS_ENTREGA", "RETIDOS", "AVARIAS_EXTERNAS", "AVARIAS_INTERNAS", "NAO_COUBE_NO_VEICULO", "ERROS_OPERACIONAIS", "FORA_DE_ROTA", "SOBRAS_TRANSFERENCIA"].filter(k => k in CAT).map(k => CAT[k]);
  const ins = insights(c);
  app.innerHTML = cabecalho("Torre de Controle", textoPeriodo(c), `<span class="farol ${ultSt}"><i></i>Último dia (${ddmm(c.b)}): ${ST_NOME[ultSt]} · ${fmt(tot[c.b])}</span>`)
    + `<div class="kpis">
      <div class="kpi hero"><div class="hero-g">
        <div><div class="kpi-l">Total de ocorrências</div><div class="kpi-v" data-n="${c.total}">0</div>
          <div class="kpi-s">${delta(c.total, c.totalPrev)}<span>${c.p ? "vs " + c.pLabel : "sem período anterior"}</span></div></div>
        <div class="hero-side"><span>Média por dia<br><b>${fmt1(c.total / c.n)}</b></span>${proj}</div>
      </div>${sparkline(c.idx.map(i => tot[i]), "#0f766e")}</div>
      ${kpiCats.map(k => kpi(c, k, corCat(k))).join("")}
    </div>
    <div class="ins-wrap"><div class="ins">${ins.map((x, j) => `<div class="in ${x.tom}" style="animation-delay:${j * 70}ms"><div class="ic">${x.ic}</div><b>${esc(x.t)}</b><p>${esc(x.p)}</p></div>`).join("")}</div>
      ${MASCOTE ? `<div class="mascote"><img src="${MASCOTE}" alt=""></div>` : ""}</div>
    <div class="row c2">
      <section class="card"><div class="card-h"><div><h2>Evolução diária de ocorrências</h2><p id="evo-sub"></p></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${S.foco != null ? `<button class="foco" id="tira-foco">${esc(D.cats[S.foco].nome)} ✕</button>` : ""}
        <div class="seg" id="modo"><button data-m="fam" class="${S.modo === "fam" ? "on" : ""}">Por família</button><button data-m="tot" class="${S.modo === "tot" ? "on" : ""}">Total</button></div></div></div>
        <div id="evo-leg"></div><div id="evo"></div></section>
      ${cardHtml("pareto", "Pareto de ocorrências", "Clique numa categoria para ver a evolução dela")}
    </div>
    ${cardHtml("cal", "Calendário farol", `Status de cada dia pelo total de ocorrências · Normal até ${fmt(LIM.atencao)} · Atenção até ${fmt(LIM.critico)} · Crítico acima de ${fmt(LIM.critico)}`, legenda([["Normal", ST_COR.ok], ["Atenção", ST_COR.aten], ["Crítico", ST_COR.crit]]))}`;
  contaAte(app);

  // Evolução
  const refs = [{ v: LIM.critico, nome: "Crítico", cor: ST_COR.crit, ink: "#b42323" }, { v: LIM.atencao, nome: "Atenção", cor: ST_COR.aten, ink: "#8a5a00" }];
  let series, leg, opts = {};
  if (S.foco != null) {
    series = [{ nome: D.cats[S.foco].nome, cor: corCat(S.foco), vals: c.idx.map(i => D.v[i][S.foco]) }];
    leg = [[D.cats[S.foco].nome, corCat(S.foco)]];
    document.getElementById("evo-sub").textContent = `${D.cats[S.foco].nome} por dia · ${fmt(c.cur[S.foco])} no período`;
  } else if (S.modo === "tot") {
    series = [{ nome: "Total", cor: "#0f766e", vals: c.idx.map(i => tot[i]) }];
    leg = [["Total do dia", "#0f766e"], ["Média móvel 7 dias", "#0b0b0b", "ln"], ["Limites do farol", ST_COR.crit, "dash"]];
    opts = { refs, linha: { vals: c.idx.map(i => MM7[i]) } };
    document.getElementById("evo-sub").textContent = "Total por dia com média móvel de 7 dias e limites do farol";
  } else {
    series = D.familias.map(f => ({ nome: f.nome, cor: FAM_COR[f.k], vals: c.idx.map(i => D.cats.reduce((s, cc, k) => s + (cc.fam === f.k ? D.v[i][k] : 0), 0)) }));
    leg = [...D.familias.map(f => [f.nome, FAM_COR[f.k]]), ["Média móvel 7 dias", "#0b0b0b", "ln"], ["Limites do farol", ST_COR.crit, "dash"]];
    opts = { refs, linha: { vals: c.idx.map(i => MM7[i]) } };
    document.getElementById("evo-sub").textContent = "Colunas empilhadas por família de ocorrência";
  }
  document.getElementById("evo-leg").innerHTML = legenda(leg);
  desenha(() => colunasDia(document.getElementById("evo"), c.idx, series, opts));
  document.querySelectorAll("#modo button").forEach(b => b.onclick = () => { S.modo = b.dataset.m; S.foco = null; render(); });
  const tf = document.getElementById("tira-foco"); if (tf) tf.onclick = () => { S.foco = null; render(); };

  // Pareto
  const ord = c.cur.map((v, k) => [k, v]).sort((x, y) => y[1] - x[1]);
  const mx = Math.max(ord[0][1], 1);
  let acc = 0, marcou = false, rows = `<div class="par-r par-h"><span>#</span><span>Ocorrência</span><span>Quantidade</span><span style="text-align:right">%</span><span class="par-c">Acum.</span></div>`;
  ord.forEach(([k, v], j) => {
    acc += v;
    const p = c.total ? v / c.total : 0, ac = c.total ? acc / c.total : 0;
    rows += `<div class="par-r ${S.foco === k ? "sel" : S.foco != null ? "dim" : ""}" data-k="${k}" role="button" tabindex="0">
      <span class="par-n">${j + 1}</span><span class="par-l" title="${esc(D.cats[k].nome)}"><i style="--c:${corCat(k)}"></i>${esc(D.cats[k].nome)}</span>
      <div class="par-t"><div class="par-b" style="--w:${v / mx};animation-delay:${j * 40}ms"></div><span>${fmt(v)}</span></div>
      <span class="par-p">${pct(p)}</span><span class="par-c">${pct(ac, 0)}</span></div>`;
    if (!marcou && ac >= .8) { marcou = true; if (j < K - 1) rows += `<div class="par-80">↑ ${pct(ac, 0)} das ocorrências em ${j + 1} categorias</div>`; }
  });
  const par = document.getElementById("pareto");
  par.innerHTML = `<div class="par">${rows}</div>`;
  par.querySelectorAll(".par-r[data-k]").forEach(r => {
    const go = () => { const k = +r.dataset.k; S.foco = S.foco === k ? null : k; render(); };
    r.onclick = go; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    r.onmousemove = ev => {
      const k = +r.dataset.k;
      mostraTip(`<div class="tt-h"><span>${esc(D.cats[k].nome)}</span></div>` + tipLinhas([
        ["No período", fmt(c.cur[k])], ["Média por dia", fmt2(c.cur[k] / c.n)],
        ...(c.prev ? [[`Anterior (${c.pLabel})`, fmt(c.prev[k])]] : []),
        ["Maior dia", (() => { const i = c.idx.reduce((m, i) => D.v[i][k] > D.v[m][k] ? i : m, c.a); return `${fmt(D.v[i][k])} em ${ddmm(i)}`; })()],
      ]), ev);
    };
    r.onmouseleave = escondeTip;
  });

  // Calendário
  const mesesP = MESES.filter(o => o.b >= c.a && o.a <= c.b);
  document.getElementById("cal").innerHTML = `<div class="cal-wrap">${mesesP.map(o => {
    const prim = new Date(datas[o.a].getFullYear(), datas[o.a].getMonth(), 1);
    let cells = ["D", "S", "T", "Q", "Q", "S", "S"].map(d => `<div class="wd">${d}</div>`).join("");
    for (let q = 0; q < prim.getDay(); q++) cells += `<div class="cd vazio"></div>`;
    for (let dia = 1; dia <= o.dim; dia++) {
      const i = o.a + dia - datas[o.a].getDate();
      if (i < o.a || i > o.b) { cells += `<div class="cd"><span>${dia}</span><b>–</b></div>`; continue; }
      const fora = i < c.a || i > c.b;
      cells += `<div class="cd ${status(tot[i])} ${fora ? "fora" : ""}" data-i="${i}"><span>${dia}</span><b>${curto(tot[i])}</b></div>`;
    }
    return `<div class="cal"><h3>${o.longo}</h3><div class="cal-g">${cells}</div></div>`;
  }).join("")}</div>`;
  document.querySelectorAll(".cd[data-i]").forEach(el => {
    el.onmousemove = ev => mostraTip(tipDia(+el.dataset.i), ev);
    el.onmouseleave = escondeTip;
  });
}

function paginaRiscos(c) {
  const kE = CAT.AVARIAS_EXTERNAS, kH = CAT.AVARIAS_INTERNAS, kL = CAT.PROJECAO_DE_EXTRAVIO;
  const perdas = c.cur[kE] + c.cur[kH] + c.cur[kL];
  const perdasPrev = c.prev ? c.prev[kE] + c.prev[kH] + c.prev[kL] : null;
  const indice = c.total ? perdas / c.total : 0;
  const indicePrev = c.prev && c.totalPrev ? perdasPrev / c.totalPrev : null;
  // Picos anômalos (≥ 3× a média dos 30 dias anteriores)
  const anom = [];
  c.idx.forEach(i => [kE, kH, kL].forEach(k => { if (anomalo(i, k)) anom.push({ i, k, v: D.v[i][k], m: MED30[i][k], x: D.v[i][k] / medBase(i, k) }); }));
  anom.sort((p, q) => q.x - p.x);
  const pico = c.idx.reduce((m, i) => D.v[i][kE] > D.v[m][kE] ? i : m, c.a);
  app.innerHTML = cabecalho("Perdas & Riscos", textoPeriodo(c), anom.length ? `<span class="badge bad">⚠ ${anom.length} pico(s) anômalo(s)</span>` : `<span class="badge good">✓ Sem picos anômalos</span>`)
    + `<div class="kpis">
      ${kpi(c, kE, "#eb6834")}${kpi(c, kH, "#4a3aa7")}${kpi(c, kL, "#d03b3b")}
      <div class="kpi" style="--c:#0b0b0b"><div class="kpi-l">Índice de sinistralidade</div><div class="kpi-v" data-n="${indice * 100}" data-dec="1" data-suf="%">0</div>
        <div class="kpi-s">${indicePrev == null ? "" : `<span class="delta ${indice > indicePrev ? "up" : "down"}">${indice > indicePrev ? "▲" : "▼"} ${fmt1(Math.abs(indice - indicePrev) * 100)} p.p.</span>`}<span>(Avarias + extravio) ÷ Total</span></div>
        <div class="kpi-s" style="margin-top:auto"><span>${fmt(perdas)} itens em risco no período</span></div></div>
      <div class="kpi" style="--c:#d03b3b"><div class="kpi-l">Pico de avarias externas</div><div class="kpi-v" data-n="${D.v[pico][kE]}">0</div>
        <div class="kpi-s"><span>em <b>${ddmm(pico)}</b> (${DOW[datas[pico].getDay()]})</span></div>
        <div class="kpi-s" style="margin-top:auto"><span><b>${fmt1(D.v[pico][kE] / medBase(pico, kE))}×</b> a média dos 30 dias anteriores (${fmt(MED30[pico][kE])})</span></div></div>
    </div>
    ${anom.length ? `<div class="alerta"><h3>⚠ Picos anômalos de perda no período</h3><ul>${anom.slice(0, 5).map(a => `<li><b>${ddmm(a.i)} (${DOW[datas[a.i].getDay()]})</b> — ${fmt(a.v)} ${esc(D.cats[a.k].nome)}: <b>${fmt1(a.x)}×</b> a média dos 30 dias anteriores (${fmt(a.m)}). Vale investigar: veículo, rota, lote ou erro de lançamento.</li>`).join("")}</ul>${anom.length > 5 ? `<span class="ax">+${anom.length - 5} outro(s) na aba Auditoria (marcados com ⚑).</span>` : ""}</div>`
      : `<div class="alerta ok"><h3>✓ Nenhum pico anômalo de perda no período</h3><ul><li>Nenhum dia passou de 3× a média dos 30 dias anteriores em Avarias ou Projeção de extravio.</li></ul></div>`}
    <section class="card"><div class="card-h"><div><h2>Avarias internas × Externas × Projeção de extravio</h2><p>Por dia · passe o mouse para comparar</p></div></div>
      ${legenda([["Avarias externas", "#eb6834", "ln"], ["Avarias internas", "#4a3aa7", "ln"], ["Projeção de extravio", "#d03b3b", "ln"]])}<div id="ri-lin"></div></section>
    <div class="row c2e">
      <section class="card"><div class="card-h"><div><h2>Perdas por mês</h2><p>Média por dia em cada mês (meses incompletos ficam comparáveis)</p></div></div>
        ${legenda([["Avarias externas", "#eb6834"], ["Avarias internas", "#4a3aa7"], ["Projeção de extravio", "#d03b3b"]])}<div id="ri-mes"></div></section>
      <section class="card"><div class="card-h"><div><h2>Origem do dano</h2><p>Dentro do CD × fora (transporte) no período</p></div></div><div id="ri-orig"></div></section>
    </div>`;
  contaAte(app);
  desenha(() => linhasDia(document.getElementById("ri-lin"), c.idx, [
    { nome: "Avarias externas", cor: "#eb6834", vals: c.idx.map(i => D.v[i][kE]), area: true },
    { nome: "Avarias internas", cor: "#4a3aa7", vals: c.idx.map(i => D.v[i][kH]) },
    { nome: "Projeção de extravio", cor: "#d03b3b", vals: c.idx.map(i => D.v[i][kL]) },
  ]));
  desenha(() => colunasMes(document.getElementById("ri-mes"), MESES, [
    { nome: "Avarias externas", cor: "#eb6834", vals: MESES.map(o => o.soma[kE] / o.n) },
    { nome: "Avarias internas", cor: "#4a3aa7", vals: MESES.map(o => o.soma[kH] / o.n) },
    { nome: "Projeção de extravio", cor: "#d03b3b", vals: MESES.map(o => o.soma[kL] / o.n) },
  ]));
  const av = c.cur[kE] + c.cur[kH];
  const pe = av ? c.cur[kE] / av : 0;
  document.getElementById("ri-orig").innerHTML = av ? `
    <div style="display:flex;flex-direction:column;gap:14px;padding-top:6px">
      <div class="mix-b" style="height:38px"><div style="--c:#eb6834;flex:${c.cur[kE]}">${pe > .12 ? pct(pe, 0) : ""}</div><div style="--c:#4a3aa7;flex:${c.cur[kH]}">${1 - pe > .12 ? pct(1 - pe, 0) : ""}</div></div>
      ${legenda([[`Externas: ${fmt(c.cur[kE])}`, "#eb6834"], [`Internas: ${fmt(c.cur[kH])}`, "#4a3aa7"]])}
      <p style="margin:0;color:var(--ink-2);font-size:13px">${pe >= .5
        ? `<b>${pct(pe, 0)}</b> das avarias chegam de fora do CD — o foco é recebimento: conferir na doca, registrar com foto e devolver o custo à origem.`
        : `<b>${pct(1 - pe, 0)}</b> das avarias acontecem dentro do CD — o foco é manuseio interno: esteira, empilhamento e treinamento.`}</p>
      ${c.prev ? `<p style="margin:0;color:var(--muted);font-size:12.5px">Período anterior (${c.pLabel}): Externas ${fmt(c.prev[kE])} · Internas ${fmt(c.prev[kH])}.</p>` : ""}
    </div>` : `<div class="vazio-msg">Sem avarias no período 🎉</div>`;
}

function paginaOperacional(c) {
  app.innerHTML = cabecalho("Análise Operacional", "Tendências de cada ocorrência, padrão por dia da semana e mudança de perfil ao longo dos meses", `<span class="badge">◈ Deep-dive</span>`)
    + `<section class="card"><div class="card-h"><div><h2>Tendência mensal por ocorrência</h2><p>Média por dia em cada mês · variação do mês atual contra o anterior</p></div></div><div class="sm" id="sm"></div></section>
    <div class="row c2e">
      ${cardHtml("hm", "Padrão por dia da semana", `Média de cada dia da semana contra a média da própria ocorrência · ${c.n >= 14 ? "período selecionado" : "histórico completo (período curto)"}`,
        legenda([["Abaixo da média", "#2a78d6"], ["Na média", "#d9d8d2"], ["Acima da média", "#e34948"]]))}
      ${cardHtml("mix", "Composição por família", "Participação de cada família no total do mês", "")}
    </div>`;

  // Small multiples
  const ult = MESES[MESES.length - 1], pen = MESES[MESES.length - 2];
  const ordem = D.cats.map((_, k) => k).sort((x, y) => MESES.reduce((s, o) => s + o.soma[y], 0) - MESES.reduce((s, o) => s + o.soma[x], 0));
  document.getElementById("sm").innerHTML = ordem.map(k => {
    const vals = MESES.map(o => o.soma[k] / o.n), mx = Math.max(...vals, .001);
    const w = 200, h = 54, bw = w / vals.length;
    const cols = vals.map((v, j) => `<path d="${colTopo(j * bw + bw * .18, h - 12, h - 12 - v / mx * (h - 16), bw * .64, 3)}" fill="${corCat(k)}" opacity="${j === vals.length - 1 ? 1 : .45}"><title>${MESES[j].longo}: ${fmt2(v)}/dia</title></path><text x="${j * bw + bw / 2}" y="${h - 1}" text-anchor="middle" class="ax" style="font-size:9.5px">${MESES[j].nome}</text>`).join("");
    const vu = ult.soma[k] / ult.n, vp = pen ? pen.soma[k] / pen.n : null;
    return `<div class="sm-c"><div class="t"><i style="--c:${corCat(k)}"></i>${esc(D.cats[k].nome)}</div>
      <div class="v"><b>${fmt1(vu)}</b><small>/dia em ${ult.nome}</small>${delta(vu, vp)}</div>
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">${cols}</svg></div>`;
  }).join("");

  // Heatmap dia da semana (divergente: azul abaixo, vermelho acima)
  const base = c.n >= 14 ? c.idx : range(0, N - 1);
  const ordDow = [1, 2, 3, 4, 5, 6, 0];
  const lerp = (a, b, t) => "#" + [0, 2, 4].map(o => Math.round(parseInt(a.substr(o + 1, 2), 16) * (1 - t) + parseInt(b.substr(o + 1, 2), 16) * t).toString(16).padStart(2, "0")).join("");
  const corDiv = r => r >= 1 ? lerp("#f0efec", "#e34948", Math.min(1, (r - 1) / 1)) : lerp("#f0efec", "#2a78d6", Math.min(1, (1 - r) / .7));
  let hm = `<table class="hm"><thead><tr><th></th>${ordDow.map(d => `<th>${DOW[d]}</th>`).join("")}</tr></thead><tbody>`;
  ordem.forEach(k => {
    const media = base.reduce((s, i) => s + D.v[i][k], 0) / base.length;
    if (!media) return;
    hm += `<tr><th class="r">${esc(D.cats[k].curto)}</th>` + ordDow.map(d => {
      const ds = base.filter(i => datas[i].getDay() === d);
      const md = ds.length ? ds.reduce((s, i) => s + D.v[i][k], 0) / ds.length : 0;
      const r = md / media, forte = Math.abs(r - 1) > .55;
      return `<td style="background:${corDiv(r)};color:${forte ? "#fff" : "#0b0b0b"}" title="${D.cats[k].nome} · ${DOW_LONGO[d]}: média ${fmt1(md)}/dia (geral ${fmt1(media)})">${r >= 1 ? "+" : "−"}${Math.round(Math.abs(r - 1) * 100)}%</td>`;
    }).join("") + `</tr>`;
  });
  document.getElementById("hm").innerHTML = hm + `</tbody></table>`;

  // Composição por família
  document.getElementById("mix").innerHTML = `${legenda(D.familias.map(f => [f.nome, FAM_COR[f.k]]))}<div class="mix">${MESES.map(o => {
    const t = o.soma.reduce((x, y) => x + y, 0);
    const fams = D.familias.map(f => [f, D.cats.reduce((s, cc, k) => s + (cc.fam === f.k ? o.soma[k] : 0), 0)]);
    return `<div class="mix-r"><span>${o.nome}${o.parcial ? "*" : ""}</span><div class="mix-b">${fams.filter(([, v]) => v > 0).map(([f, v]) => `<div style="--c:${FAM_COR[f.k]};flex:${v}" title="${f.nome}: ${fmt(v)} (${pct(v / t)})">${v / t > .07 ? pct(v / t, 0) : ""}</div>`).join("")}</div></div>`;
  }).join("")}</div><p class="ax" style="margin:10px 0 0">* mês em andamento</p>`;
}

function paginaAuditoria(c) {

  const n = { crit: 0, aten: 0, ok: 0 }; sts.forEach(s => n[s]++);
  const pico = c.idx.reduce((m, i) => tot[i] > tot[m] ? i : m, c.a);
  app.innerHTML = cabecalho("Auditoria diária", textoPeriodo(c), `<span class="badge">⚑ = pico anômalo (≥ 3× a média de 30 dias)</span>`)
    + `<div class="kpis">
      <div class="kpi" style="--c:#0b0b0b"><div class="kpi-l">Total do período</div><div class="kpi-v" data-n="${c.total}">0</div><div class="kpi-s"><span>${c.n} dia(s) · média ${fmt1(c.total / c.n)}/dia</span></div></div>
      <div class="kpi" style="--c:${ST_COR.crit}"><div class="kpi-l">Dias críticos</div><div class="kpi-v" data-n="${n.crit}">0</div><div class="kpi-s"><span>acima de ${fmt(LIM.critico)} · ${pct(n.crit / c.n, 0)} dos dias</span></div></div>
      <div class="kpi" style="--c:${ST_COR.aten}"><div class="kpi-l">Dias em atenção</div><div class="kpi-v" data-n="${n.aten}">0</div><div class="kpi-s"><span>${fmt(LIM.atencao + 1)} a ${fmt(LIM.critico)} · ${pct(n.aten / c.n, 0)} dos dias</span></div></div>
      <div class="kpi" style="--c:${ST_COR.ok}"><div class="kpi-l">Dias normais</div><div class="kpi-v" data-n="${n.ok}">0</div><div class="kpi-s"><span>até ${fmt(LIM.atencao)} · ${pct(n.ok / c.n, 0)} dos dias</span></div></div>
      <div class="kpi" style="--c:#0f766e"><div class="kpi-l">Maior pico diário</div><div class="kpi-v" data-n="${tot[pico]}">0</div><div class="kpi-s"><span>em <b>${ddmm(pico)}</b> (${DOW[datas[pico].getDay()]})</span></div></div>
    </div>
    <section class="card"><div class="card-h"><div><h2>Tabela de auditoria · farol automático</h2><p>Clique no título da coluna para ordenar · a cor de fundo mostra o tamanho de cada valor dentro da coluna</p></div>
      <div class="chips" id="chips">
        ${[["todos", "Todos", c.n, ""], ["crit", "Crítico", n.crit, ST_COR.crit], ["aten", "Atenção", n.aten, ST_COR.aten], ["ok", "Normal", n.ok, ST_COR.ok]].map(([k, t, q, cor]) => `<button class="chip ${S.filtro === k ? "on" : ""}" data-f="${k}">${cor ? `<i style="--c:${cor}"></i>` : ""}${t} (${q})</button>`).join("")}

      <div class="tbl" id="tbl"></div></section>`;
  contaAte(app);
  document.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; render(); });
  document.getElementById("csv").onclick = () => exportaCsv(linhasTabela(c));

  const linhas = linhasTabela(c);
  const maxCol = D.cats.map((_, k) => Math.max(1, ...c.idx.map(i => D.v[i][k])));
  const cols = [["data", "Data"], ...D.cats.map((cc, k) => [k, cc.curto]), ["tot", "Total"], ["st", "Status"]];
  const sumF = soma(0, -1).map((_, k) => linhas.reduce((s, i) => s + D.v[i][k], 0));
  document.getElementById("tbl").innerHTML = linhas.length ? `<table><thead><tr>${cols.map(([k, t]) => `<th data-c="${k}" class="${S.ordem.col == k ? "sorted" : ""}" title="${k === "data" || k === "tot" || k === "st" ? "" : esc(D.cats[k].nome)}">${esc(t)}${S.ordem.col == k ? (S.ordem.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody>
    ${linhas.map(i => `<tr><td>${ddmm(i)}/${D.dias[i].slice(2, 4)} <span class="ax">${DOW[datas[i].getDay()]}</span></td>${D.cats.map((_, k) => {
      const v = D.v[i][k], a = v / maxCol[k];
      return `<td class="${anomalo(i, k) ? "anom" : ""}" ${anomalo(i, k) ? `title="${fmt1(v / medBase(i, k))}× a média dos 30 dias anteriores (${fmt(MED30[i][k])})"` : ""} style="${v ? `background:rgba(238,77,45,${(a * .28).toFixed(3)})` : "color:#c3c2b7"}">${fmt(v)}</td>`;
    }).join("")}<td class="tot">${fmt(tot[i])}</td><td><span class="farol ${status(tot[i])}"><i></i>${ST_NOME[status(tot[i])]}</span></td></tr>`).join("")}
    </tbody><tfoot><tr><td>Total (${linhas.length})</td>${sumF.map(v => `<td>${fmt(v)}</td>`).join("")}<td>${fmt(sumF.reduce((x, y) => x + y, 0))}</td><td></td></tr></tfoot></table>`
    : `<div class="vazio-msg">Nenhum dia com esse status no período.</div>`;
  document.querySelectorAll("#tbl th").forEach(th => th.onclick = () => {
    const k = th.dataset.c, col = isNaN(+k) ? k : +k;
    S.ordem = { col, dir: S.ordem.col === col ? -S.ordem.dir : -1 };
    render();
  });
}
function linhasTabela(c) {
  const chave = i => S.ordem.col === "data" ? i : S.ordem.col === "tot" || S.ordem.col === "st" ? tot[i] : D.v[i][S.ordem.col];
  return c.idx.filter(i => S.filtro === "todos" || status(tot[i]) === S.filtro).sort((x, y) => (chave(x) - chave(y)) * S.ordem.dir || y - x);
}
function exportaCsv(linhas) {
  const cab = ["Data", ...D.cats.map(c => c.nome), "Total", "Status"];
  const corpo = linhas.map(i => [D.dias[i].split("-").reverse().join("/"), ...D.v[i], tot[i], ST_NOME[status(tot[i])]]);
  const csv = "﻿" + [cab, ...corpo].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `ocorrencias_${D.dias[S.a]}_a_${D.dias[S.b]}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= montagem ================= */
const TABS = [
  ["torre", "Torre de Controle", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>'],
  ["riscos", "Perdas & Riscos", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>'],
  ["oper", "Análise Operacional", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/></svg>'],
  ["audit", "Auditoria diária", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>'],
];
const PAGINAS = { torre: paginaTorre, riscos: paginaRiscos, oper: paginaOperacional, audit: paginaAuditoria };

function montaTopo() {
  document.getElementById("logo").innerHTML = LOGO ? `<img src="${LOGO}" alt="Lucas Rodrigues">` : `<div class="wordmark">Lucas <i>Rodrigues</i></div>`;
  document.getElementById("titulo").textContent = `Ocorrências ${D.hub}`;
  document.title = `Ocorrências ${D.hub} · Lucas Rodrigues`;
  document.getElementById("ultimo").textContent = `Dados até ${ddmm(N - 1)}/${D.dias[N - 1].slice(0, 4)}`;
  document.getElementById("gerado").textContent = `Atualizado em ${D.gerado}`;
  document.getElementById("tabs").innerHTML = TABS.map(([k, t, ic]) => `<button class="tab" data-t="${k}">${ic}${t}</button>`).join("") + `<span class="stamp">Atualizado em <b>${D.gerado}</b></span>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  document.getElementById("presets").innerHTML = PRESETS.map(([k, t]) => `<button data-p="${k}">${t}</button>`).join("");
  document.querySelectorAll("#presets button").forEach(b => b.onclick = () => { aplicaPreset(b.dataset.p); S.foco = null; render(); });
  const de = document.getElementById("de"), ate = document.getElementById("ate");
  [de, ate].forEach(inp => { inp.min = D.dias[0]; inp.max = D.dias[N - 1]; });
  const porData = (s, fallback) => { const i = D.dias.indexOf(s); return i < 0 ? fallback : i; };
  de.onchange = () => { S.a = porData(de.value, S.a); if (S.a > S.b) S.b = S.a; S.preset = null; render(); };
  ate.onchange = () => { S.b = porData(ate.value, S.b); if (S.b < S.a) S.a = S.b; S.preset = null; render(); };
}

function render() {
  escondeTip();
  desenhos.length = 0;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  document.querySelectorAll("#presets button").forEach(b => b.classList.toggle("on", b.dataset.p === S.preset));
  document.getElementById("de").value = D.dias[S.a];
  document.getElementById("ate").value = D.dias[S.b];
  PAGINAS[S.tab](ctx());
}

let tResize;
addEventListener("resize", () => { clearTimeout(tResize); tResize = setTimeout(() => desenhos.forEach(fn => fn()), 120); });
addEventListener("scroll", escondeTip, { passive: true });

montaTopo();
// Link direto: Dashboard.html#riscos ou #torre/tudo (aba/período)
const [hTab, hPer] = location.hash.slice(1).split("/");
aplicaPreset(PRESETS.some(([k]) => k === hPer) ? hPer : "mes");
if (PAGINAS[hTab]) S.tab = hTab;
render();
</script>
</body>
</html>

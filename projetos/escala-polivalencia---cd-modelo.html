const fmt1 = v => v == null || !isFinite(v) ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct = (v, d = 0) => v == null || !isFinite(v) ? "—" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const soma = a => a.reduce((x, y) => x + y, 0);
const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], DOWL = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const dt = i => new Date(D.dias[i] + "T00:00:00");

const curto = n => { const p = n.split(" "); return p[0] + " " + (p[p.length - 1] || "")[0] + "."; };

/* ---------------- períodos ---------------- */
const semanas = [];
D.dias.forEach((_, i) => { const d = dt(i); if (i === 0 || d.getDay() === 1) semanas.push([]); semanas[semanas.length - 1].push(i); });
const PER = [{ nome: `Todo o período (${ddmm(0)} a ${ddmm(ND - 1)})`, ids: D.dias.map((_, i) => i), prev: null }];
if (semanas.length > 4) PER.push({ nome: "Últimas 4 semanas", ids: semanas.slice(-4).flat(), prev: semanas.length > 8 ? semanas.slice(-8, -4).flat() : null, prevNome: "4 semanas anteriores" });
semanas.forEach((ids, k) => PER.push({ nome: `Semana ${k + 1} (${ddmm(ids[0])} a ${ddmm(ids[ids.length - 1])})`, ids, prev: k ? semanas[k - 1] : null, prevNome: `semana ${k}` }));

/* ---------------- níveis de domínio (acumulado até o fim do período) ---------------- */
// Referência: 8+ dias na tarefa · Apto: 3 a 7 · Em aprendizado: 1 a 2
const NIVEL = d => d >= 8 ? 3 : d >= 3 ? 2 : d >= 1 ? 1 : 0;
const NIVEL_NOME = ["—", "Em aprendizado", "Apto", "Referência"];
function agg(ids) {
  const set = new Set(ids), fim = Math.max(...ids);
  const r = D.reg.filter(x => set.has(x[0]));
  const P = D.pessoas.map((nome, k) => ({ k, nome, dias: new Set(), aloc: 0, carga: 0, tarefas: new Set(), areas: new Set(), reforco: 0, primeiro: null }));
  const T = D.tarefas.map(([nome, area, peso], k) => ({ k, nome, area, peso, aloc: 0, pessoas: new Set() }));
  const porDia = ids.map(i => ({ i, pessoas: new Set(), area: {} }));
  const idx = Object.fromEntries(ids.map((i, k) => [i, k]));
  r.forEach(([d, p, t, o]) => {
    const x = P[p]; x.dias.add(d); x.aloc++; x.carga += tPeso(t); x.tarefas.add(t); x.areas.add(tArea(t)); if (o > 0 && tArea(t) === "Expedição") x.reforco++;
    T[t].aloc++; T[t].pessoas.add(p);
    const pd = porDia[idx[d]]; pd.pessoas.add(p); (pd.area[tArea(t)] || (pd.area[tArea(t)] = new Set())).add(p);
  });
  // domínio acumulado até o último dia do período
  const dd = Array.from({ length: NP }, () => new Array(NT).fill(0)), visto = Array.from({ length: NP }, () => new Array(NT).fill(-1));
  D.reg.forEach(([d, p, t]) => { if (d <= fim && visto[p][t] !== d) { dd[p][t]++; visto[p][t] = d; } });
  const primeiroDia = new Array(NP).fill(null); D.reg.forEach(([d, p]) => { if (primeiroDia[p] == null || d < primeiroDia[p]) primeiroDia[p] = d; });
  const ativos = P.filter(x => x.dias.size);
  ativos.forEach(x => {
    x.niveis = dd[x.k].map(NIVEL); x.aptas = x.niveis.filter(n => n >= 2).length; x.cargaDia = x.carga / x.dias.size;
    x.novato = primeiroDia[x.k] >= 7 && primeiroDia[x.k] >= ids[0] - 13; /* entrou depois da 1ª semana, há no máximo 2 semanas do início do período */ x.perfil = x.novato ? "nov" : x.aptas >= 4 ? "pol" : x.aptas <= 1 ? "esp" : "";
  });
  T.forEach(t => { t.aptos = ativos.filter(x => x.niveis[t.k] >= 2).length; t.ref = ativos.filter(x => x.niveis[t.k] === 3).length; t.st = t.aptos <= 2 ? "crit" : t.aptos <= 4 ? "aten" : "ok"; });
  const presentes = porDia.map(x => x.pessoas.size);
  return { ids, P, ativos, T, porDia, dd, aloc: r.length, presMed: soma(presentes) / ids.length, aptMed: soma(ativos.map(x => x.aptas)) / (ativos.length || 1), cargaMed: soma(ativos.map(x => x.carga)) / (soma(ativos.map(x => x.dias.size)) || 1), alocPorPessoaDia: r.length / (soma(presentes) || 1) };
}
const CACHE = {}; const A = ids => CACHE[ids.join()] || (CACHE[ids.join()] = agg(ids));

/* ---------------- estado / peças ---------------- */
const S = { tab: "geral", per: 0, ordem: "aptas", areaMx: "Todas" };
const ctx = () => { const P = PER[S.per]; return { P, X: A(P.ids), B: P.prev ? A(P.prev) : null }; };
const tip = $("#tip");
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tt]"); if (!el) { tip.hidden = true; return; } tip.innerHTML = el.dataset.tt; tip.hidden = false; mover(e); });
document.addEventListener("mousemove", e => { if (!tip.hidden) mover(e); });
function mover(e) { const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`; }
const tt = (t, l) => esc(`<div class="tt-h">${t}</div>` + l.map(([n, v, c]) => `<div class="tt-r"><i style="--c:${c || "transparent"}"></i><span>${n}</span><b>${v}</b></div>`).join(""));
function delta(cur, prev, bomSubir = true) { if (prev == null || cur == null || !prev) return ""; const v = (cur - prev) / Math.abs(prev); if (Math.abs(v) < .0005) return `<span class="delta eq">=</span>`; return `<span class="delta ${(v > 0) === bomSubir ? "bom" : "ruim"}">${v > 0 ? "▲" : "▼"} ${pct(Math.abs(v), 1)}</span>`; }
const kpi = (n, v, s, c, x = "") => `<div class="kpi" style="--c:${c}"><div class="kpi-l">${n}</div><div class="kpi-v">${v}</div><div class="kpi-s">${s}</div><div class="kpi-f">${x}</div></div>`;
const card = (t, s, corpo, acao = "") => `<section class="card"><div class="card-h"><div><h3>${t}</h3>${s ? `<p>${s}</p>` : ""}</div>${acao}</div>${corpo}</section>`;
const ins = (n, ic, t, p) => `<div class="in ${n}"><span class="ic">${ic}</span><b>${t}</b><p>${p}</p></div>`;
const ST_NOME = { ok: "Coberta", aten: "Atenção", crit: "Crítica" };
function cab(t, s) { const { P } = ctx(); return `<div class="sec-h"><div><h2>${t}</h2><p>${s}</p></div><div class="badges"><span class="badge">${esc(P.nome)}</span>${P.prev ? `<span class="badge cinza">vs ${esc(P.prevNome)}</span>` : ""}</div></div>`; }
const DESENHOS = []; let tmr; addEventListener("resize", () => { clearTimeout(tmr); tmr = setTimeout(() => DESENHOS.forEach(f => f()), 120); });
function eixo(maxV, n = 4) { const bruto = maxV / n, mag = Math.pow(10, Math.floor(Math.log10(bruto || 1))); const p = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= bruto); const o = []; for (let v = 0; v <= maxV + p * .5; v += p) o.push(v); return o; }

/* pessoas por dia, empilhado por área de trabalho principal */
function colDias(el, X) {
  const W = el.clientWidth || 800, H = 280, pl = 40, pr = 8, pt = 18, pb = 34, n = X.porDia.length;
  const tot = X.porDia.map(d => d.pessoas.size), mx = Math.max(...tot, 1), tk = eixo(mx), top = tk[tk.length - 1];
  const bw = (W - pl - pr) / n, w = Math.max(3, Math.min(30, bw * .7)), y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  tk.forEach(v => (s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`));
  X.porDia.forEach((d, k) => {
    // área principal de cada pessoa no dia = área da 1ª tarefa
    const cont = {}; D.reg.forEach(r => { if (r[0] === d.i && r[3] === 0) cont[tArea(r[2])] = (cont[tArea(r[2])] || 0) + 1; });
    const cx = pl + k * bw + bw / 2, dom = dt(d.i).getDay() === 0; let base = 0;
    s += `<g data-tt="${tt(`${DOWL[dt(d.i).getDay()]}, ${ddmm(d.i)}`, [...D.areas.filter(a => cont[a]).map(a => [a, fmt(cont[a]), AREA_HEX[a]]), ["Total de pessoas", fmt(d.pessoas.size)]])}"><rect x="${cx - bw / 2}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>`;
    D.areas.forEach(a => { const v = cont[a] || 0; if (!v) return; s += `<rect x="${cx - w / 2}" y="${y(base + v) + .5}" width="${w}" height="${Math.max(0, y(base) - y(base + v) - 1)}" fill="${AREA_HEX[a]}" rx="1.5"/>`; base += v; });
    if (n <= 14 || k % Math.ceil(n / 14) === 0) s += `<text class="ax" x="${cx}" y="${H - 18}" text-anchor="middle" style="font-size:10px">${ddmm(d.i)}</text><text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle" style="font-size:9.5px;${dom ? "fill:var(--bad-ink);font-weight:700" : ""}">${DOW[dt(d.i).getDay()]}</text>`;
    s += `</g>`;
  });
  el.innerHTML = s + "</svg>";
}
/* dias trabalhados x tarefas que domina (bolha = carga média) */
function bolhas(el, X) {
  const pts = X.ativos, W = el.clientWidth || 600, H = 320, pl = 46, pr = 16, pt = 16, pb = 38;
  const mxX = Math.max(...pts.map(p => p.dias.size), 1) * 1.06, mxY = Math.max(...pts.map(p => p.aptas), 4) + 1;
  const tkX = eixo(mxX, 5), tX = tkX[tkX.length - 1], x = v => pl + v / tX * (W - pl - pr), y = v => pt + (H - pt - pb) * (1 - v / mxY);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (let v = 0; v <= mxY; v++) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text class="ax" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  tkX.forEach(v => (s += `<text class="ax" x="${x(v)}" y="${H - 20}" text-anchor="middle">${fmt(v)}</text>`));
  s += `<text class="ax" x="${(pl + W - pr) / 2}" y="${H - 3}" text-anchor="middle" style="font-weight:700">dias trabalhados no período</text><text class="ax" x="${pl}" y="${pt - 4}" style="font-weight:700">tarefas em que é apto ou referência</text>`;
  s += `<rect x="${pl}" y="${y(mxY)}" width="${W - pl - pr}" height="${y(4) - y(mxY)}" fill="#eaf2fc" opacity=".55"/><text class="ax" x="${W - pr - 4}" y="${y(mxY) + 14}" text-anchor="end" style="font-weight:700;fill:#1c5cab">polivalentes (4+ tarefas)</text>`;
  const cor = p => p.perfil === "nov" ? "#4a3aa7" : p.perfil === "pol" ? "#2a78d6" : p.perfil === "esp" ? "#eda100" : "#c2410c";
  const jit = k => ((k * 37) % 11 - 5) / 18;
  pts.forEach(p => {
    const r = 5 + 6 * Math.min(1.6, p.cargaDia / 1.4);

/* ---------------- telas ---------------- */
function insights(X, B) {
  const o = [], crit = X.T.filter(t => t.aloc && t.st === "crit").sort((a, b) => a.aptos - b.aptos);
  if (crit.length) o.push(ins("crit", "!", `${crit.length} tarefa(s) dependem de 1 ou 2 pessoas`, `${crit.map(t => `<b>${esc(t.nome)}</b> (${t.aptos})`).join(", ")}. Se essas pessoas faltam, a tarefa para ou é feita por quem não sabe. Vale montar um plano de treinamento cruzado.`));
  const esp = X.ativos.filter(x => x.perfil === "esp"), pol = X.ativos.filter(x => x.perfil === "pol");
  o.push(ins(pol.length >= X.ativos.length * .3 ? "ok" : "aten", "⇄", `${pol.length} polivalentes e ${esp.length} especialistas`, `Polivalente = apto em 4 ou mais tarefas. A média da equipe é <b>${fmt1(X.aptMed)}</b> tarefas por pessoa. Quanto maior, mais fácil cobrir faltas e picos.`));

  const fraco = dw.reduce((a, b) => b.m < a.m ? b : a), forte = dw.reduce((a, b) => b.m > a.m ? b : a);
  o.push(ins("info", "📅", `${DOWL[fraco.w]} tem a menor equipe: ${fmt1(fraco.m)} pessoas`, `Contra ${fmt1(forte.m)} na ${DOWL[forte.w].toLowerCase()}. Compare com o volume do dia para ver se a escala acompanha a demanda.`));
  const ref = X.ativos.filter(x => x.reforco > 0), pctRef = soma(X.ativos.map(x => x.reforco)) / (soma(X.ativos.map(x => x.dias.size)) || 1);
  o.push(ins("info", "🚚", `${pct(pctRef)} dos turnos terminam reforçando a expedição`, `${ref.length} pessoas fizeram a expedição como 2ª tarefa do dia. É o gargalo do fim do turno: o carregamento precisa de gente de outras áreas para sair no horário.`));

  return o.join("");
}

function telaGeral() {

      ${kpi("Carga média", fmt1(X.cargaMed), "pontos de esforço por pessoa/dia", "var(--a4)", delta(X.cargaMed, B && B.cargaMed, false))}

      ${kpi("Polivalentes", fmt(X.ativos.filter(x => x.perfil === "pol").length), "aptos em 4+ tarefas", "var(--a1)")}
      ${kpi("Especialistas", fmt(X.ativos.filter(x => x.perfil === "esp").length), "aptos em 1 tarefa ou menos", "var(--a4)")}
      ${kpi("Tarefas críticas", fmt(X.T.filter(t => (t.aloc || t.aptos) && t.st === "crit").length), "com 2 aptos ou menos", "var(--bad)")}
      ${kpi("Tarefas em atenção", fmt(X.T.filter(t => (t.aloc || t.aptos) && t.st === "aten").length), "com 3 ou 4 aptos", "var(--warn)")}
      ${kpi("Em aprendizado", fmt(soma(X.ativos.map(x => x.niveis.filter(n => n === 1).length))), "pares pessoa × tarefa começando", "#e87ba4")}
    </div>
    ${card("Matriz colaborador × tarefa", "Ordenada pelos mais polivalentes · passe o mouse nas células", mx, `<div class="chips">${["Todas", ...D.areas].map(a => `<button class="chip ${S.areaMx === a ? "on" : ""}" data-area="${a}">${a}</button>`).join("")}</div>`)}
    <div class="row c2">
      ${card("Cobertura de cada tarefa", "Quantas pessoas estão aptas · vermelho = depende de 1 ou 2 pessoas", `<div class="hb">${cob.map(t => `<div class="hb-r" data-tt="${tt(esc(t.nome), [["Aptos", fmt(t.aptos)], ["Referências", fmt(t.ref)], ["Alocações no período", fmt(t.aloc)]])}"><div class="hb-l"><i style="--c:${AREA_HEX[t.area]}"></i><span>${esc(t.nome)}</span></div><div class="hb-t"><i style="--w:${t.aptos / mxC};--c:${t.st === "crit" ? "var(--bad)" : t.st === "aten" ? "var(--warn)" : "var(--good)"}"></i></div><div class="hb-v">${t.aptos} aptos<small><span class="st ${t.st}" style="padding:0 7px">${ST_NOME[t.st]}</span></small></div></div>`).join("")}</div>`)}
      ${card("Como ler", "", `<div class="met"><b>Por que polivalência importa?</b><br><br>Uma tarefa que só 1 ou 2 pessoas sabem fazer é um <b>ponto único de falha</b>: basta uma falta ou férias para a operação travar ou ser feita por alguém sem treino, o que aumenta erros e acidentes.<br><br><b>Regra usada:</b> a pessoa é <b>apta</b> depois de 3 dias na tarefa e <b>referência</b> depois de 8. A meta saudável é ter pelo menos <b>5 aptos</b> em cada tarefa.<br><br><b>Ação sugerida:</b> para cada tarefa crítica, escolher 2 pessoas em aprendizado e escalá-las junto com uma referência por 1 semana.</div>`)}
    </div>`;
}

function telaEquipe() {
  const { X, P } = ctx();
  const lista = [...X.ativos].sort((a, b) => S.ordem === "carga" ? b.cargaDia - a.cargaDia : S.ordem === "dias" ? b.dias.size - a.dias.size : b.aptas - a.aptas || b.dias.size - a.dias.size);
  const mxD = Math.max(...lista.map(x => x.dias.size), 1);
  const linhas = lista.map((x, i) => `<tr><td class="l mut">${i + 1}</td><td class="l"><b>${esc(x.nome)}</b> ${x.perfil === "pol" ? '<span class="tag pol">polivalente</span>' : x.perfil === "esp" ? '<span class="tag esp">especialista</span>' : x.perfil === "nov" ? '<span class="tag nov">novato</span>' : ""}</td>
    <td class="l"><span class="barra" style="width:${x.dias.size / mxD * 80}px"></span>${x.dias.size}</td><td>${fmt(x.aloc)}</td><td><b>${x.aptas}</b></td><td>${x.tarefas.size}</td><td>${[...x.areas].map(a => `<span title="${a}" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${AREA_HEX[a]};margin-left:2px"></span>`).join("")}</td>
    <td style="color:${x.cargaDia > X.cargaMed * 1.25 ? "var(--bad-ink)" : "inherit"};font-weight:${x.cargaDia > X.cargaMed * 1.25 ? 800 : 400}">${fmt1(x.cargaDia)}</td><td>${x.reforco ? fmt(x.reforco) : "—"}</td></tr>`).join("");
  DESENHOS.push(() => bolhas($("#g-bolhas"), X));
  return `${cab("Equipe", "Dias trabalhados, tarefas que cada pessoa domina e equilíbrio de carga")}
    <div class="kpis">
      ${kpi("Colaboradores", fmt(X.ativos.length), "com ao menos 1 dia no período", "var(--brand)")}
      ${kpi("Dias por pessoa", fmt1(soma(X.ativos.map(x => x.dias.size)) / (X.ativos.length || 1)), `de ${X.ids.length} dia(s) do período`, "var(--a1)")}
      ${kpi("Tarefas diferentes", fmt1(soma(X.ativos.map(x => x.tarefas.size)) / (X.ativos.length || 1)), "por pessoa no período (rodízio)", "var(--a3)")}
      ${kpi("Carga média", fmt1(X.cargaMed), "pontos de esforço por dia", "var(--a4)")}
      ${kpi("Acima da média", fmt(X.ativos.filter(x => x.dias.size >= 3 && x.cargaDia > X.cargaMed * 1.25).length), "carga 25%+ acima da equipe", "var(--bad)")}
      ${kpi("Reforço na expedição", fmt(soma(X.ativos.map(x => x.reforco))), "vezes em que foi a 2ª tarefa do dia", "var(--a4)")}
    </div>
    ${card("Quadro da equipe", "Carga = soma do peso de esforço das tarefas (descarga e carregamento pesam mais; 5S e inventário pesam menos)", `<div class="tbl alta"><table><thead><tr><th class="l">#</th><th class="l">Colaborador</th><th class="l">Dias</th><th>Alocações</th><th>Aptas</th><th>Diferentes</th><th>Áreas</th><th>Carga/dia</th><th>Reforço exp.</th></tr></thead><tbody>${linhas}</tbody></table></div>`,
      `<div class="chips"><button class="chip ${S.ordem === "aptas" ? "on" : ""}" data-ordem="aptas">Polivalência</button><button class="chip ${S.ordem === "dias" ? "on" : ""}" data-ordem="dias">Dias</button><button class="chip ${S.ordem === "carga" ? "on" : ""}" data-ordem="carga">Carga</button></div>`)}
    ${card("Presença × polivalência", "Cada bolha é uma pessoa; o tamanho é a carga média por dia", `<div class="legend"><span><i style="--c:#2a78d6"></i>Polivalente</span><span><i style="--c:#eda100"></i>Especialista</span><span><i style="--c:#4a3aa7"></i>Novato</span><span><i style="--c:#c2410c"></i>Intermediário</span></div><div class="chart" id="g-bolhas"></div>`)}`;
}

function telaEscala() {
  const { X } = ctx();
  // média de pessoas por área x dia da semana (área da tarefa principal)
  const ord = [1, 2, 3, 4, 5, 6, 0], mat = {}, cnt = {};
  X.porDia.forEach(d => { const w = dt(d.i).getDay(); cnt[w] = (cnt[w] || 0) + 1; D.reg.forEach(r => { if (r[0] === d.i && r[3] === 0) { const a = tArea(r[2]); mat[a + w] = (mat[a + w] || 0) + 1; } }); });
  const val = (a, w) => cnt[w] ? (mat[a + w] || 0) / cnt[w] : null, mxV = Math.max(...D.areas.flatMap(a => ord.map(w => val(a, w) || 0)), 1);
  const cor = t => { const r = ["#fff4ed", "#fde7d8", "#fbc9a6", "#f59e0b", "#d97706", "#9a3412"]; const i = Math.min(r.length - 1, Math.round(t * (r.length - 1))); return { bg: r[i], fg: i >= 4 ? "#fff" : "var(--ink)" }; };
  const hm = `<table class="hm"><tr><th class="r">Área</th>${ord.map(w => `<th>${DOW[w]}</th>`).join("")}</tr>${D.areas.filter(a => ord.some(w => val(a, w))).map(a => `<tr><th class="r"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${AREA_HEX[a]};margin-right:6px"></span>${a}</th>${ord.map(w => { const v = val(a, w); if (v == null) return `<td style="background:#f6f5f3">—</td>`; const c = cor(v / mxV); return `<td style="background:${c.bg};color:${c.fg}" data-tt="${tt(a + " · " + DOWL[w], [["Pessoas em média", fmt1(v)]])}">${fmt1(v)}</td>`; }).join("")}</tr>`).join("")}
    <tr><th class="r">Total</th>${ord.map(w => { const d = X.porDia.filter(x => dt(x.i).getDay() === w); return `<td style="font-weight:800">${d.length ? fmt1(soma(d.map(x => x.pessoas.size)) / d.length) : "—"}</td>`; }).join("")}</tr></table>`;
  // evolução semana a semana (todas as semanas)
  const ev = semanas.map((ids, k) => { const a = A(ids); return { k, ids, pres: a.presMed, apt: a.aptMed, crit: a.T.filter(t => t.aloc && t.st === "crit").length }; });
  const mxP = Math.max(...ev.map(e => e.pres), 1), mxAp = Math.max(...ev.map(e => e.apt), 1);
  const evol = `<div class="tbl"><table><thead><tr><th class="l">Semana</th><th class="l">Presentes/dia</th><th class="l">Polivalência média</th><th>Tarefas críticas</th></tr></thead><tbody>${ev.map(e => `<tr style="${X.ids.includes(e.ids[0]) ? "background:#fff7f1" : ""}"><td class="l"><b>Semana ${e.k + 1}</b> <span class="mut">${ddmm(e.ids[0])}–${ddmm(e.ids[e.ids.length - 1])}</span></td><td class="l"><span class="barra" style="width:${e.pres / mxP * 120}px;--c:var(--a1)"></span>${fmt1(e.pres)}</td><td class="l"><span class="barra" style="width:${e.apt / mxAp * 120}px;--c:var(--a2)"></span>${fmt1(e.apt)}</td><td style="color:${e.crit ? "var(--bad-ink)" : "var(--good-ink)"};font-weight:700">${e.crit}</td></tr>`).join("")}</tbody></table></div>`;
  return `${cab("Escala", "Como a equipe se distribui nos dias da semana e como evolui semana a semana")}
    <div class="row c2e">
      ${card("Pessoas por área e dia da semana", "Média de pessoas em cada área (pela tarefa principal do dia)", hm + `<p class="nota">Use este quadro junto com o volume de cada dia: se a segunda-feira recebe mais carga, ela precisa de mais gente em recebimento e triagem.</p>`)}
      ${card("Evolução semana a semana", "A polivalência sobe conforme a equipe roda entre as tarefas e os novatos aprendem", evol)}
    </div>`;
}

function telaDados() {
  const { X, P } = ctx(), set = new Set(X.ids);
  const r = D.reg.filter(x => set.has(x[0])).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[3] - b[3]);
  return `${cab("Dados", "A escala diária que alimenta o painel")}
    ${card("Alocações", `${fmt(r.length)} registros`, `<div class="tbl alta"><table><thead><tr><th class="l">Data</th><th class="l">Colaborador</th><th class="l">Tarefa</th><th class="l">Área</th><th>Ordem no dia</th></tr></thead><tbody>${r.map(x => `<tr><td class="l">${DOW[dt(x[0]).getDay()]} ${ddmm(x[0])}</td><td class="l">${esc(D.pessoas[x[1]])}</td><td class="l">${esc(D.tarefas[x[2]][0])}</td><td class="l"><span class="tag" style="background:${AREA_HEX[tArea(x[2])]}22;color:var(--ink)">${tArea(x[2])}</span></td><td>${x[3] + 1}ª</td></tr>`).join("")}</tbody></table></div>`, `<button class="btn" data-csv="1">Exportar CSV</button>`)}`;
}
function exportar() {
  const { X, P } = ctx(), set = new Set(X.ids);
  const l = [["Data", "Colaborador", "Tarefa", "Área", "Ordem"], ...D.reg.filter(x => set.has(x[0])).map(x => [D.dias[x[0]], D.pessoas[x[1]], D.tarefas[x[2]][0], tArea(x[2]), x[3] + 1])];
  const csv = "﻿" + l.map(r => r.map(v => `"${v}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `Escala - ${P.nome}.csv`; a.click();
}

/* ---------------- render ---------------- */
const TABS = [["geral", "Visão Geral", '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>'], ["poli", "Polivalência", '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'],
  ["equipe", "Equipe", '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>'], ["escala", "Escala", '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
  ["dados", "Dados", '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>']];
const TELAS = { geral: telaGeral, poli: telaPoli, equipe: telaEquipe, escala: telaEscala, dados: telaDados };
function render(manter) { const y = scrollY; DESENHOS.length = 0; tip.hidden = true; $("#app").innerHTML = TELAS[S.tab](); document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab)); DESENHOS.forEach(f => f()); if (manter) scrollTo(0, y); }
$("#tabs").innerHTML = TABS.map(([k, n, ic]) => `<button class="tab" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}</button>`).join("");
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) { S.tab = t.dataset.tab; render(); scrollTo({ top: 0 }); } });
$("#per").innerHTML = PER.map((p, i) => `<option value="${i}">${esc(p.nome)}</option>`).join("");
$("#per").addEventListener("change", e => { S.per = +e.target.value; render(true); });
$("#app").addEventListener("click", e => {
  const o = e.target.closest("[data-ordem]"); if (o) { S.ordem = o.dataset.ordem; return render(true); }
  const a = e.target.closest("[data-area]"); if (a) { S.areaMx = a.dataset.area; return render(true); }
  if (e.target.closest("[data-csv]")) exportar();
});
if (TELAS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
$("#logo").innerHTML = LOGO ? `<img src="${LOGO}" alt="Lucas Rodrigues · Analista de Dados & BI">` : "<b>Lucas Rodrigues</b>";
$("#gerado").textContent = `${ND} dias · ${NP} colaboradores · ${NT} tarefas · gerado em ${D.gerado}`;
render();
</script>
</body>
</html>
